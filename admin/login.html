<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zavora Social | Admin Login</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    font-family:Arial,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 20% 20%,rgba(168,85,247,.18),transparent 35%),
        radial-gradient(circle at 80% 80%,rgba(34,211,238,.12),transparent 35%),
        #080612;
}

.login-box{
    width:100%;
    max-width:430px;
    background:#100b1f;
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:34px;
    box-shadow:0 25px 70px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:800;
    margin-bottom:8px;
}

.logo span{
    background:linear-gradient(90deg,#a855f7,#22d3ee);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.admin-label{
    text-align:center;
    color:#a855f7;
    font-size:12px;
    font-weight:700;
    letter-spacing:1.5px;
    margin-bottom:30px;
}

h1{
    font-size:22px;
    margin-bottom:8px;
}

.subtitle{
    color:#8f899e;
    font-size:14px;
    line-height:1.6;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    font-size:13px;
    color:#b5aec1;
    margin-bottom:8px;
}

.input-wrap{
    position:relative;
}

input{
    width:100%;
    padding:14px 45px 14px 14px;
    border-radius:11px;
    border:1px solid rgba(255,255,255,.1);
    background:#080612;
    color:#fff;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#a855f7;
    box-shadow:0 0 0 3px rgba(168,85,247,.1);
}

.password-toggle{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    color:#8f899e;
    cursor:pointer;
    font-size:12px;
}

.login-btn{
    width:100%;
    border:0;
    border-radius:11px;
    padding:14px;
    color:#fff;
    font-weight:700;
    cursor:pointer;
    background:linear-gradient(90deg,#9333ea,#06b6d4);
    margin-top:5px;
    transition:.2s;
}

.login-btn:hover{
    transform:translateY(-1px);
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.message{
    display:none;
    margin-top:16px;
    padding:12px 14px;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
    word-break:break-word;
}

.message.error{
    display:block;
    color:#fca5a5;
    background:rgba(239,68,68,.1);
    border:1px solid rgba(239,68,68,.2);
}

.message.success{
    display:block;
    color:#86efac;
    background:rgba(34,197,94,.1);
    border:1px solid rgba(34,197,94,.2);
}

.back-link{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#8f899e;
    text-decoration:none;
    font-size:13px;
}

.back-link:hover{
    color:#fff;
}

.security-note{
    margin-top:24px;
    padding:13px;
    border-radius:11px;
    background:rgba(34,211,238,.05);
    border:1px solid rgba(34,211,238,.1);
    color:#8f899e;
    font-size:11px;
    line-height:1.6;
    text-align:center;
}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        Zavora <span>Social</span>
    </div>

    <div class="admin-label">
        ADMIN PANEL
    </div>

    <h1>
        Admin Login
    </h1>

    <p class="subtitle">
        Sign in with your authorized administrator account.
    </p>

    <form id="loginForm">

        <div class="form-group">

            <label for="email">
                Admin Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="admin@example.com"
                autocomplete="username"
                required
            >

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="input-wrap">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    id="togglePassword"
                >
                    Show
                </button>

            </div>

        </div>

        <button
            type="submit"
            class="login-btn"
            id="loginButton"
        >
            Login to Admin
        </button>

        <div
            class="message"
            id="message"
        ></div>

    </form>

    <a
        href="../index.html"
        class="back-link"
    >
        ← Back to Zavora Social
    </a>

    <div class="security-note">
        🔐 Admin access is restricted to authorized accounts.
    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    setPersistence,
    browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


/* =====================================
   FIREBASE CONFIG
===================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBzj9_rGqPW21duk4sxyLUO3hy3-6GwGs",

    authDomain:
        "zavorasocial.firebaseapp.com",

    projectId:
        "zavorasocial",

    storageBucket:
        "zavorasocial.firebasestorage.app",

    messagingSenderId:
        "447170165246",

    appId:
        "1:447170165246:web:982649e6533257ea0f28af",

    measurementId:
        "G-D4LNBEWH50"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


/* =====================================
   ADMIN EMAIL
===================================== */

const ADMIN_EMAIL =
    "omoboyejohn@gmail.com";


/* =====================================
   ELEMENTS
===================================== */

const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");

const togglePassword =
    document.getElementById("togglePassword");


/* =====================================
   PASSWORD TOGGLE
===================================== */

togglePassword.addEventListener(
    "click",
    () => {

        if(passwordInput.type === "password"){

            passwordInput.type = "text";
            togglePassword.textContent = "Hide";

        }else{

            passwordInput.type = "password";
            togglePassword.textContent = "Show";

        }

    }
);


/* =====================================
   MESSAGE
===================================== */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

}


/* =====================================
   LOGIN
===================================== */

loginForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();

        const password =
            passwordInput.value;


        if(!email || !password){

            showMessage(
                "Please enter your email and password.",
                "error"
            );

            return;

        }


        if(
            email !==
            ADMIN_EMAIL.toLowerCase()
        ){

            showMessage(
                "This account is not authorized for the admin panel.",
                "error"
            );

            return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Signing in...";


        try{

            /*
             * Keep the Firebase session after
             * moving between admin pages.
             */

            await setPersistence(
                auth,
                browserLocalPersistence
            );


            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            showMessage(
                "Login successful. Opening admin dashboard...",
                "success"
            );


            setTimeout(
                () => {

                    window.location.replace(
                        "index.html"
                    );

                },
                700
            );


        }catch(error){

            console.error(
                "FULL ADMIN LOGIN ERROR:",
                error
            );


            /*
             * IMPORTANT:
             * Show the actual Firebase error code.
             * This will tell us exactly what is wrong.
             */

            let errorMessage =
                "Firebase error: " +
                (error.code || "unknown-error");


            if(error.code === "auth/invalid-credential"){

                errorMessage =
                    "Invalid email or password.";

            }

            else if(error.code === "auth/user-not-found"){

                errorMessage =
                    "This Firebase account does not exist.";

            }

            else if(error.code === "auth/wrong-password"){

                errorMessage =
                    "The password is incorrect.";

            }

            else if(error.code === "auth/invalid-email"){

                errorMessage =
                    "The email address is invalid.";

            }

            else if(error.code === "auth/user-disabled"){

                errorMessage =
                    "This Firebase account has been disabled.";

            }

            else if(error.code === "auth/too-many-requests"){

                errorMessage =
                    "Too many login attempts. Please wait and try again.";

            }

            else if(error.code === "auth/network-request-failed"){

                errorMessage =
                    "Network error. Check your internet connection.";

            }

            else if(error.code === "auth/operation-not-allowed"){

                errorMessage =
                    "Email/password authentication is disabled in Firebase.";

            }

            else if(error.code === "auth/unauthorized-domain"){

                errorMessage =
                    "This website domain is not authorized in Firebase.";

            }

            else if(error.code === "auth/popup-blocked"){

                errorMessage =
                    "Firebase popup was blocked by the browser.";

            }


            showMessage(
                errorMessage,
                "error"
            );


            loginButton.disabled = false;

            loginButton.textContent =
                "Login to Admin";

        }

    }
);

</script>

</body>
</html>
