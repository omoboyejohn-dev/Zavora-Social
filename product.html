<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Zavora Social | Product</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    min-height:100vh;
    color:#fff;

    background:
        radial-gradient(
            circle at top left,
            rgba(124,58,237,.18),
            transparent 35%
        ),
        radial-gradient(
            circle at top right,
            rgba(6,182,212,.12),
            transparent 30%
        ),
        #080b16;
}

header{
    position:sticky;
    top:0;
    z-index:100;

    background:rgba(8,11,22,.88);
    backdrop-filter:blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

.navbar{
    max-width:1100px;
    min-height:70px;

    margin:auto;
    padding:0 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    color:#fff;
    text-decoration:none;
    font-size:22px;
    font-weight:900;
}

.logo span{
    background:
        linear-gradient(
            90deg,
            #a78bfa,
            #22d3ee
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.back-btn{
    text-decoration:none;
    color:#cbd5e1;

    padding:10px 14px;
    border-radius:10px;

    background:rgba(255,255,255,.05);

    border:
        1px solid rgba(255,255,255,.08);

    font-size:13px;
    font-weight:700;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:35px 20px 70px;
}

.product-box{
    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);

    gap:30px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:24px;

    overflow:hidden;

    box-shadow:
        0 25px 70px rgba(0,0,0,.25);
}

.product-image{
    min-height:450px;
    background:#111827;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    min-height:450px;

    object-fit:cover;
    display:block;
}

.product-details{
    padding:40px 35px;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.category{
    display:inline-block;
    width:max-content;

    color:#67e8f9;

    background:
        rgba(6,182,212,.08);

    border:
        1px solid rgba(6,182,212,.2);

    padding:7px 11px;

    border-radius:9px;

    font-size:12px;
    font-weight:800;

    margin-bottom:16px;
}

.product-name{
    font-size:36px;
    line-height:1.2;
    font-weight:900;
    margin-bottom:15px;
}

.price{
    color:#67e8f9;
    font-size:30px;
    font-weight:900;
    margin-bottom:20px;
}

.description{
    color:#94a3b8;
    line-height:1.7;
    font-size:15px;
    margin-bottom:25px;
}

.wallet-box{
    padding:17px;

    border-radius:14px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.08);

    margin-bottom:18px;
}

.wallet-label{
    color:#94a3b8;
    font-size:12px;
    margin-bottom:5px;
}

.wallet-balance{
    font-size:22px;
    font-weight:900;
    color:#fff;
}

.buy-btn{
    width:100%;
    border:none;
    cursor:pointer;
    color:#fff;

    padding:15px;

    border-radius:12px;

    font-size:15px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #06b6d4
        );

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.buy-btn:hover{
    transform:translateY(-1px);
}

.buy-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
}

.continue{
    display:block;
    text-align:center;
    margin-top:15px;

    color:#94a3b8;
    text-decoration:none;
    font-size:13px;
}

.loading{
    max-width:600px;
    margin:70px auto;

    text-align:center;
    padding:50px;

    color:#94a3b8;
}

.error{
    max-width:600px;
    margin:70px auto;

    text-align:center;
    padding:50px;

    border:
        1px solid rgba(239,68,68,.2);

    border-radius:20px;

    background:
        rgba(239,68,68,.06);

    color:#fca5a5;
}

.error h2{
    color:#fff;
    margin-bottom:10px;
}

.message{
    position:fixed;
    inset:0;

    z-index:500;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.72);

    backdrop-filter:blur(8px);
}

.message-box{
    width:100%;
    max-width:440px;

    padding:30px;

    border-radius:20px;

    text-align:center;

    background:#101522;

    border:
        1px solid rgba(255,255,255,.1);

    box-shadow:
        0 25px 80px rgba(0,0,0,.4);
}

.message-icon{
    font-size:45px;
    margin-bottom:12px;
}

.message-box h2{
    margin-bottom:10px;
}

.message-box p{
    color:#94a3b8;

    line-height:1.6;
    margin-bottom:20px;

    white-space:pre-wrap;
    word-break:break-word;
}

.message-btn{
    width:100%;

    border:none;
    color:#fff;

    padding:12px;

    border-radius:10px;

    cursor:pointer;

    font-weight:800;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #06b6d4
        );
}

.delivery-box{
    margin-top:18px;

    padding:18px;

    border-radius:14px;

    background:
        rgba(34,211,238,.06);

    border:
        1px solid rgba(34,211,238,.18);

    text-align:left;
}

.delivery-title{
    color:#67e8f9;

    font-size:13px;
    font-weight:900;

    margin-bottom:9px;
}

.delivery-content{
    color:#e2e8f0;

    line-height:1.7;
    font-size:14px;

    white-space:pre-wrap;
    word-break:break-word;

    background:
        rgba(0,0,0,.2);

    padding:12px;

    border-radius:10px;
}

@media(max-width:800px){

    .product-box{
        grid-template-columns:1fr;
    }

    .product-image{
        min-height:300px;
    }

    .product-image img{
        min-height:300px;
    }

    .product-details{
        padding:30px 22px;
    }

    .product-name{
        font-size:29px;
    }

}

@media(max-width:500px){

    .container{
        padding:
            20px
            14px
            50px;
    }

    .product-image{
        min-height:260px;
    }

    .product-image img{
        min-height:260px;
    }

}

</style>

</head>

<body>

<header>

<div class="navbar">

    <a
        href="dashboard.html"
        class="logo"
    >
        Zavora <span>Social</span>
    </a>

    <a
        href="products.html"
        class="back-btn"
    >
        ← Products
    </a>

</div>

</header>


<main class="container">

<div
    id="content"
    class="loading"
>

    Checking your account...

</div>

</main>


<div
    id="message"
    class="message"
>

<div class="message-box">

    <div
        id="messageIcon"
        class="message-icon"
    >
        ⚠️
    </div>

    <h2 id="messageTitle">
        Message
    </h2>

    <p id="messageText">
        Please wait...
    </p>

    <button
        id="messageButton"
        class="message-btn"
    >
        Continue
    </button>

</div>

</div>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    get,
    push,
    update,
    runTransaction
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyBzj9_rGqPW21duk4sxyLUO3hy3-6GwGs",

    authDomain:
        "zavorasocial.firebaseapp.com",

    databaseURL:
        "https://zavorasocial-default-rtdb.firebaseio.com/",

    projectId:
        "zavorasocial",

    storageBucket:
        "zavorasocial.firebasestorage.app",

    messagingSenderId:
        "447170165246",

    appId:
        "1:447170165246:web:982649e6533257ea0f28af",

    measurementId:
        "G-D4LNBEWH50"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getDatabase(app);


const content =
    document.getElementById("content");

const message =
    document.getElementById("message");

const messageIcon =
    document.getElementById("messageIcon");

const messageTitle =
    document.getElementById("messageTitle");

const messageText =
    document.getElementById("messageText");

const messageButton =
    document.getElementById("messageButton");


const params =
    new URLSearchParams(
        window.location.search
    );

const productId =
    params.get("id");


let currentUser = null;

let currentProduct = null;

let currentWalletBalance = 0;

let purchaseInProgress = false;


/* ==========================================
   AUTH FIX
========================================== */

let authCheckFinished = false;


/*
 * Give Firebase time to restore the
 * existing browser login session.
 *
 * We DO NOT redirect immediately when
 * the first auth callback is empty.
 */

const authTimeout =
    setTimeout(() => {

        if(!authCheckFinished){

            authCheckFinished = true;

            console.log(
                "No Firebase login session found."
            );

            window.location.replace(
                "login.html"
            );

        }

    }, 4000);


onAuthStateChanged(
    auth,
    async (user) => {

        /*
         * Firebase has now finished checking
         * the current authentication state.
         */

        if(authCheckFinished){

            return;

        }


        authCheckFinished = true;

        clearTimeout(authTimeout);


        console.log(
            "Zavora authentication:",
            user
                ? user.email
                : "No authenticated user"
        );


        if(!user){

            window.location.replace(
                "login.html"
            );

            return;

        }


        /*
         * User is authenticated.
         */

        currentUser =
            user;


        if(!productId){

            showError(
                "Product not found",
                "No product was selected."
            );

            return;

        }


        await loadProduct(user);

    }
);


/* ==========================================
   LOAD PRODUCT
========================================== */

async function loadProduct(user){

    try{

        const productRef =
            ref(
                db,
                "products/" +
                productId
            );


        const snapshot =
            await get(productRef);


        if(!snapshot.exists()){

            showError(
                "Product not found",
                "This product may have been removed."
            );

            return;

        }


        const product =
            snapshot.val();


        if(product.active !== true){

            showError(
                "Product unavailable",
                "This product is currently unavailable."
            );

            return;

        }


        currentProduct =
            product;


        renderProduct(
            product,
            user
        );

    }
    catch(error){

        console.error(
            "Product loading error:",
            error
        );


        showError(
            "Unable to load product",
            "Please refresh the page and try again."
        );

    }

}


/* ==========================================
   RENDER PRODUCT
========================================== */

function renderProduct(
    product,
    user
){

    const image =
        product.image ||
        "https://via.placeholder.com/700x600?text=Zavora";


    const name =
        product.name ||
        "Unnamed Product";


    const price =
        Number(
            product.price || 0
        );


    const category =
        product.category ||
        "Product";


    const description =
        product.description ||
        "Quality digital product available on Zavora Social.";


    content.className =
        "product-box";


    content.innerHTML = `

        <div class="product-image">

            <img
                id="productImage"
                src="${escapeHtml(image)}"
                alt="${escapeHtml(name)}"
            >

        </div>


        <div class="product-details">

            <div class="category">

                📦
                ${escapeHtml(category)}

            </div>


            <h1 class="product-name">

                ${escapeHtml(name)}

            </h1>


            <div class="price">

                ₦${formatNumber(price)}

            </div>


            <div class="description">

                ${escapeHtml(description)}

            </div>


            <div class="wallet-box">

                <div class="wallet-label">

                    Your Wallet Balance

                </div>

                <div
                    id="walletBalance"
                    class="wallet-balance"
                >

                    Checking...

                </div>

            </div>


            <button
                id="buyButton"
                class="buy-btn"
                type="button"
            >

                Buy Now — ₦${formatNumber(price)}

            </button>


            <a
                href="products.html"
                class="continue"
            >

                ← Continue Shopping

            </a>

        </div>

    `;


    const productImage =
        document.getElementById(
            "productImage"
        );


    if(productImage){

        productImage.addEventListener(
            "error",
            function(){

                this.src =
                    "https://via.placeholder.com/700x600?text=Zavora";

            }
        );

    }


    const buyButton =
        document.getElementById(
            "buyButton"
        );


    if(buyButton){

        buyButton.addEventListener(
            "click",
            purchaseProduct
        );

    }


    loadWallet(user);

}


/* ==========================================
   LOAD WALLET
========================================== */

async function loadWallet(user){

    const walletBalance =
        document.getElementById(
            "walletBalance"
        );


    if(!walletBalance){

        return;

    }


    try{

        const walletRef =
            ref(
                db,
                "users/" +
                user.uid +
                "/walletBalance"
            );


        const snapshot =
            await get(walletRef);


        currentWalletBalance =
            snapshot.exists()
            ? Number(
                snapshot.val() || 0
            )
            : 0;


        walletBalance.textContent =
            "₦" +
            formatNumber(
                currentWalletBalance
            );

    }
    catch(error){

        console.error(
            "Wallet error:",
            error
        );


        walletBalance.textContent =
            "Unavailable";

    }

}


/* ==========================================
   PURCHASE
========================================== */

async function purchaseProduct(){

    if(purchaseInProgress){

        return;

    }


    if(!currentUser){

        showMessage(
            "🔐",
            "Login Required",
            "Please login before purchasing."
        );

        return;

    }


    if(!currentProduct){

        showMessage(
            "⚠️",
            "Product Error",
            "The product could not be loaded."
        );

        return;

    }


    const price =
        Number(
            currentProduct.price || 0
        );


    if(!Number.isFinite(price) || price <= 0){

        showMessage(
            "⚠️",
            "Invalid Price",
            "This product has an invalid price."
        );

        return;

    }


    purchaseInProgress = true;


    const buyButton =
        document.getElementById(
            "buyButton"
        );


    if(buyButton){

        buyButton.disabled = true;

        buyButton.textContent =
            "Processing Purchase...";

    }


    try{

        const walletRef =
            ref(
                db,
                "users/" +
                currentUser.uid +
                "/walletBalance"
            );


        const walletSnapshot =
            await get(walletRef);


        const walletBalance =
            walletSnapshot.exists()
            ? Number(
                walletSnapshot.val() || 0
            )
            : 0;


        currentWalletBalance =
            walletBalance;


        if(walletBalance < price){

            showMessage(
                "💳",
                "Insufficient Balance",
                "Your wallet balance is ₦" +
                formatNumber(walletBalance) +
                ".\n\nYou need ₦" +
                formatNumber(price) +
                " to purchase this product."
            );


            resetBuyButton();

            return;

        }


        const inventoryRef =
            ref(
                db,
                "inventory/" +
                productId
            );


        const inventorySnapshot =
            await get(inventoryRef);


        if(!inventorySnapshot.exists()){

            showMessage(
                "📦",
                "Out of Stock",
                "This product currently has no available item."
            );


            resetBuyButton();

            return;

        }


        let selectedItemId = null;

        let selectedItem = null;


        inventorySnapshot.forEach(
            (child) => {

                if(selectedItemId){

                    return;

                }


                const item =
                    child.val();


                if(
                    item &&
                    item.status === "available" &&
                    typeof item.details === "string" &&
                    item.details.trim() !== ""
                ){

                    selectedItemId =
                        child.key;

                    selectedItem =
                        item;

                }

            }
        );


        if(
            !selectedItemId ||
            !selectedItem
        ){

            showMessage(
                "📦",
                "Out of Stock",
                "This product is currently out of stock."
            );


            resetBuyButton();

            return;

        }


        const itemRef =
            ref(
                db,
                "inventory/" +
                productId +
                "/" +
                selectedItemId
            );


        const reservation =
            await runTransaction(
                itemRef,
                (item) => {

                    if(!item){

                        return;

                    }


                    if(
                        item.status !==
                        "available"
                    ){

                        return;

                    }


                    return {

                        ...item,

                        status:
                            "processing",

                        processingBy:
                            currentUser.uid,

                        processingAt:
                            Date.now()

                    };

                }
            );


        if(!reservation.committed){

            showMessage(
                "📦",
                "Item Just Sold",
                "Someone else purchased the last available item. Please try again."
            );


            resetBuyButton();

            return;

        }


        const walletTransaction =
            await runTransaction(
                walletRef,
                (balance) => {

                    const currentBalance =
                        Number(
                            balance || 0
                        );


                    if(
                        currentBalance < price
                    ){

                        return;

                    }


                    return Number(
                        (
                            currentBalance -
                            price
                        ).toFixed(2)
                    );

                }
            );


        if(!walletTransaction.committed){

            await update(
                itemRef,
                {
                    status:
                        "available",

                    processingBy:
                        null,

                    processingAt:
                        null

                }
            );


            showMessage(
                "💳",
                "Insufficient Balance",
                "Your wallet balance is not enough to complete this purchase."
            );


            resetBuyButton();

            return;

        }


        const orderRef =
            push(
                ref(db, "orders")
            );


        const orderId =
            orderRef.key;


        const now =
            Date.now();


        const orderData = {

            uid:
                currentUser.uid,

            email:
                currentUser.email || "",

            productId:
                productId,

            productName:
                currentProduct.name ||
                "Product",

            category:
                currentProduct.category ||
                "Product",

            amount:
                price,

            paymentMethod:
                "Wallet",

            inventoryItemId:
                selectedItemId,

            itemDetails:
                selectedItem.details,

            status:
                "completed",

            createdAt:
                now

        };


        await update(
            orderRef,
            orderData
        );


        await update(
            itemRef,
            {

                status:
                    "sold",

                soldTo:
                    currentUser.uid,

                soldToEmail:
                    currentUser.email || "",

                soldAt:
                    now,

                orderId:
                    orderId,

                processingBy:
                    null,

                processingAt:
                    null

            }
        );


        const newBalance =
            Number(
                (
                    walletBalance -
                    price
                ).toFixed(2)
            );


        currentWalletBalance =
            newBalance;


        const walletDisplay =
            document.getElementById(
                "walletBalance"
            );


        if(walletDisplay){

            walletDisplay.textContent =
                "₦" +
                formatNumber(
                    newBalance
                );

        }


        showPurchaseSuccess(
            orderId,
            selectedItem.details,
            newBalance
        );


    }
    catch(error){

        console.error(
            "Purchase error:",
            error
        );


        showMessage(
            "⚠️",
            "Purchase Failed",
            error?.message ||
            "Something went wrong while processing your purchase."
        );


        resetBuyButton();

    }

}


function showPurchaseSuccess(
    orderId,
    itemDetails,
    newBalance
){

    messageIcon.textContent =
        "🎉";


    messageTitle.textContent =
        "Purchase Successful!";


    messageText.innerHTML =
        "";


    messageText.appendChild(
        document.createTextNode(
            "Your order has been completed.\n\n" +
            "Order ID: " +
            orderId +
            "\n\n" +
            "Remaining Wallet Balance: ₦" +
            formatNumber(newBalance)
        )
    );


    const deliveryBox =
        document.createElement("div");


    deliveryBox.className =
        "delivery-box";


    const deliveryTitle =
        document.createElement("div");


    deliveryTitle.className =
        "delivery-title";


    deliveryTitle.textContent =
        "📦 Your Delivered Item";


    const deliveryContent =
        document.createElement("div");


    deliveryContent.className =
        "delivery-content";


    deliveryContent.textContent =
        itemDetails;


    deliveryBox.appendChild(
        deliveryTitle
    );


    deliveryBox.appendChild(
        deliveryContent
    );


    messageText.appendChild(
        deliveryBox
    );


    messageButton.textContent =
        "View My Orders";


    messageButton.onclick =
        () => {

            window.location.href =
                "orders.html";

        };


    message.style.display =
        "flex";


    const buyButton =
        document.getElementById(
            "buyButton"
        );


    if(buyButton){

        buyButton.disabled = true;

        buyButton.textContent =
            "Purchased ✓";

    }

}


function resetBuyButton(){

    purchaseInProgress =
        false;


    const buyButton =
        document.getElementById(
            "buyButton"
        );


    if(!buyButton){

        return;

    }


    buyButton.disabled =
        false;


    const price =
        Number(
            currentProduct?.price || 0
        );


    buyButton.textContent =
        "Buy Now — ₦" +
        formatNumber(price);

}


function showError(
    title,
    text
){

    content.className =
        "error";


    content.innerHTML = `

        <div
            style="
                font-size:45px;
                margin-bottom:10px
            "
        >
            ⚠️
        </div>

        <h2>
            ${escapeHtml(title)}
        </h2>

        <p>
            ${escapeHtml(text)}
        </p>

        <br>

        <a
            href="products.html"
            style="
                color:#67e8f9;
                text-decoration:none;
                font-weight:800;
            "
        >
            ← Back to Products
        </a>

    `;

}


function showMessage(
    icon,
    title,
    text
){

    messageIcon.textContent =
        icon;

    messageTitle.textContent =
        title;

    messageText.textContent =
        text;

    messageButton.textContent =
        "Continue";

    messageButton.onclick =
        () => {

            message.style.display =
                "none";

        };

    message.style.display =
        "flex";

}


function formatNumber(value){

    return Number(value)
        .toLocaleString(
            "en-NG",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}
