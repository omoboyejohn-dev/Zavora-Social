<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zavora Social | Product</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#090014,#12002b,#001827);
    color:#fff;
    min-height:100vh;
}

header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid rgba(255,255,255,.1);
    background:rgba(0,0,0,.35);
}

.logo{
    font-size:21px;
    font-weight:800;
    background:linear-gradient(90deg,#b84cff,#00eaff);
    -webkit-background-clip:text;
    color:transparent;
}

.back-btn{
    color:#fff;
    text-decoration:none;
    font-size:14px;
    padding:10px 15px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:10px;
}

.container{
    width:min(1050px,92%);
    margin:35px auto;
}

.product-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-radius:22px;
    padding:25px;
}

.product-image-box{
    min-height:360px;
    border-radius:18px;
    overflow:hidden;
    background:#080808;
    display:flex;
    align-items:center;
    justify-content:center;
}

.product-image{
    width:100%;
    height:100%;
    max-height:500px;
    object-fit:contain;
}

.product-info{
    padding:10px 5px;
}

.category{
    display:inline-block;
    background:rgba(0,234,255,.12);
    color:#00eaff;
    padding:7px 12px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:15px;
}

h1{
    font-size:32px;
    margin-bottom:12px;
}

.description{
    color:#bdb9ca;
    line-height:1.7;
    margin:18px 0;
    white-space:pre-line;
}

.price{
    font-size:29px;
    font-weight:800;
    margin:20px 0;
    color:#00eaff;
}

.wallet{
    padding:15px;
    border-radius:13px;
    background:rgba(0,234,255,.08);
    border:1px solid rgba(0,234,255,.2);
    margin-bottom:18px;
}

.wallet small{
    color:#aaa;
}

.wallet strong{
    display:block;
    font-size:22px;
    margin-top:5px;
}

.buy-btn{
    width:100%;
    padding:16px;
    border:0;
    border-radius:13px;
    background:linear-gradient(90deg,#9b32ff,#00dfff);
    color:#fff;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.buy-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.continue{
    display:block;
    text-align:center;
    margin-top:15px;
    color:#aaa;
    text-decoration:none;
}

.loading{
    text-align:center;
    padding:80px 20px;
    color:#aaa;
}

.error{
    text-align:center;
    padding:60px 20px;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(420px,100%);
    background:#151020;
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;
    padding:28px;
    text-align:center;
}

.modal-box h2{
    margin-bottom:12px;
}

.modal-box p{
    color:#bbb;
    line-height:1.6;
    margin-bottom:20px;
}

.modal-btn{
    width:100%;
    border:0;
    padding:14px;
    border-radius:12px;
    background:linear-gradient(90deg,#9b32ff,#00dfff);
    color:#fff;
    font-weight:700;
    cursor:pointer;
}

.success{
    color:#00eaff;
}

.fail{
    color:#ff5c8a;
}

@media(max-width:750px){

    .product-box{
        grid-template-columns:1fr;
    }

    .product-image-box{
        min-height:280px;
    }

    h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        Zavora Social
    </div>

    <a href="products.html" class="back-btn">
        ← Products
    </a>

</header>


<div class="container">

    <div id="loading" class="loading">
        Loading product...
    </div>


    <div id="productArea" style="display:none;">

        <div class="product-box">

            <div class="product-image-box">

                <img
                    id="productImage"
                    class="product-image"
                    src=""
                    alt="Product"
                >

            </div>


            <div class="product-info">

                <span id="productCategory" class="category">
                    Product
                </span>


                <h1 id="productName">
                    Product
                </h1>


                <div id="productDescription" class="description">
                    Loading description...
                </div>


                <div id="productPrice" class="price">
                    ₦0.00
                </div>


                <div class="wallet">

                    <small>
                        Your Wallet Balance
                    </small>

                    <strong id="walletBalance">
                        ₦0.00
                    </strong>

                </div>


                <button id="buyButton" class="buy-btn">
                    Buy Now
                </button>


                <a href="products.html" class="continue">
                    ← Continue Shopping
                </a>

            </div>

        </div>

    </div>


    <div id="errorArea" class="error" style="display:none;">

        <h2>
            Product Not Found
        </h2>

        <p id="errorText">
            This product could not be loaded.
        </p>

        <br>

        <a href="products.html" class="back-btn">
            Back to Products
        </a>

    </div>

</div>


<div id="messageModal" class="modal">

    <div class="modal-box">

        <h2 id="modalTitle">
            Purchase
        </h2>

        <p id="modalMessage">
            ...
        </p>

        <button id="modalButton" class="modal-btn">
            Continue
        </button>

    </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    get,
    set,
    push
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyBzjZ9_rGqPW21duk4sxyLUO3hy3-6GwGs",

    authDomain:
        "zavorasocial.firebaseapp.com",

    databaseURL:
        "https://zavorasocial-default-rtdb.firebaseio.com",

    projectId:
        "zavorasocial",

    storageBucket:
        "zavorasocial.firebasestorage.app",

    messagingSenderId:
        "447170165246",

    appId:
        "1:447170165246:web:982649e6533257ea0f28af",

    measurementId:
        "G-D4LNBEWH50"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


const loading =
    document.getElementById("loading");

const productArea =
    document.getElementById("productArea");

const errorArea =
    document.getElementById("errorArea");

const errorText =
    document.getElementById("errorText");

const productImage =
    document.getElementById("productImage");

const productName =
    document.getElementById("productName");

const productCategory =
    document.getElementById("productCategory");

const productDescription =
    document.getElementById("productDescription");

const productPrice =
    document.getElementById("productPrice");

const walletBalance =
    document.getElementById("walletBalance");

const buyButton =
    document.getElementById("buyButton");

const messageModal =
    document.getElementById("messageModal");

const modalTitle =
    document.getElementById("modalTitle");

const modalMessage =
    document.getElementById("modalMessage");

const modalButton =
    document.getElementById("modalButton");


const params =
    new URLSearchParams(window.location.search);

const productId =
    params.get("productId");


let currentUser = null;

let currentProduct = null;

let currentWalletBalance = 0;


function money(amount){

    return "₦" +
        Number(amount || 0).toLocaleString(
            "en-NG",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );
}


function showMessage(
    title,
    message,
    success = false
){

    modalTitle.textContent = title;

    modalMessage.textContent = message;

    modalTitle.className =
        success ? "success" : "fail";

    messageModal.classList.add("show");

}


modalButton.addEventListener(
    "click",
    () => {

        messageModal.classList.remove("show");

    }
);


async function loadWallet(){

    const walletRef =
        ref(
            db,
            "users/" +
            currentUser.uid +
            "/walletBalance"
        );

    const snapshot =
        await get(walletRef);

    currentWalletBalance =
        Number(snapshot.val()) || 0;

    walletBalance.textContent =
        money(currentWalletBalance);
}


async function loadProduct(){

    if(!productId){

        loading.style.display = "none";

        errorArea.style.display = "block";

        errorText.textContent =
            "No product was selected.";

        return;
    }


    try{

        const productRef =
            ref(
                db,
                "products/" + productId
            );

        const snapshot =
            await get(productRef);


        if(!snapshot.exists()){

            loading.style.display = "none";

            errorArea.style.display = "block";

            errorText.textContent =
                "This product does not exist.";

            return;
        }


        const product =
            snapshot.val();


        if(product.active === false){

            loading.style.display = "none";

            errorArea.style.display = "block";

            errorText.textContent =
                "This product is currently unavailable.";

            return;
        }


        currentProduct = {

            id:productId,

            ...product

        };


        productName.textContent =
            product.name || "Unnamed Product";


        productCategory.textContent =
            product.category || "Product";


        productDescription.textContent =
            product.description ||
            "Quality digital product available from Zavora Social.";


        productPrice.textContent =
            money(product.price);


        if(product.image){

            productImage.src =
                product.image;

        }else{

            productImage.style.display =
                "none";

        }


        loading.style.display = "none";

        productArea.style.display = "block";


        await loadWallet();


    }catch(error){

        console.error(error);

        loading.style.display = "none";

        errorArea.style.display = "block";

        errorText.textContent =
            "Unable to load this product. Please try again.";

    }

}


buyButton.addEventListener(
    "click",
    async () => {

        if(!currentUser){

            window.location.href =
                "login.html";

            return;
        }


        if(!currentProduct){

            showMessage(
                "Purchase Failed",
                "Product information is not available."
            );

            return;
        }


        const price =
            Number(currentProduct.price);


        if(!Number.isFinite(price) || price <= 0){

            showMessage(
                "Purchase Failed",
                "This product has an invalid price."
            );

            return;
        }


        buyButton.disabled = true;

        buyButton.textContent =
            "Processing...";


        try{

            const walletRef =
                ref(
                    db,
                    "users/" +
                    currentUser.uid +
                    "/walletBalance"
                );


            /*
             * Get the latest wallet balance.
             */

            const walletSnapshot =
                await get(walletRef);


            const balance =
                Number(walletSnapshot.val()) || 0;


            /*
             * Check balance.
             */

            if(balance < price){

                buyButton.disabled = false;

                buyButton.textContent =
                    "Buy Now";

                walletBalance.textContent =
                    money(balance);


                showMessage(
                    "Insufficient Balance",
                    "Your wallet balance is " +
                    money(balance) +
                    ". You need " +
                    money(price) +
                    " to purchase this product."
                );

                return;
            }


            /*
             * Calculate new balance.
             */

            const newBalance =
                balance - price;


            /*
             * Save new wallet balance.
             */

            await set(
                walletRef,
                newBalance
            );


            /*
             * Create order.
             */

            const ordersRef =
                ref(db,"orders");


            const newOrderRef =
                push(ordersRef);


            const orderData = {

                uid:
                    currentUser.uid,

                email:
                    currentUser.email || "",

                productId:
                    currentProduct.id,

                productName:
                    currentProduct.name ||
                    "Unnamed Product",

                price:
                    price,

                category:
                    currentProduct.category ||
                    "Product",

                image:
                    currentProduct.image ||
                    "",

                description:
                    currentProduct.description ||
                    "",

                status:
                    "completed",

                deliveryStatus:
                    "pending",

                createdAt:
                    Date.now()

            };


            try{

                await set(
                    newOrderRef,
                    orderData
                );

            }catch(orderError){

                /*
                 * Refund wallet if order
                 * creation fails.
                 */

                await set(
                    walletRef,
                    balance
                );

                throw orderError;
            }


            /*
             * Update screen.
             */

            currentWalletBalance =
                newBalance;


            walletBalance.textContent =
                money(newBalance);


            buyButton.disabled = false;

            buyButton.textContent =
                "Buy Now";


            showMessage(
                "Order Completed",
                "Your purchase was successful. " +
                money(price) +
                " has been deducted from your wallet. " +
                "Your new balance is " +
                money(newBalance) +
                ".",
                true
            );


            modalButton.textContent =
                "View My Orders";


            modalButton.onclick = () => {

                window.location.href =
                    "orders.html";

            };


        }catch(error){

            console.error(
                "Purchase error:",
                error
            );


            buyButton.disabled = false;

            buyButton.textContent =
                "Buy Now";


            showMessage(
                "Purchase Failed",
                "Unable to complete your purchase. Please try again."
            );

        }

    }
);


onAuthStateChanged(
    auth,
    async (user) => {

        if(!user){

            window.location.href =
                "login.html";

            return;
        }


        currentUser = user;

        await loadProduct();

    }
);

</script>

</body>
</html>
