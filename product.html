<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zavora Social | Product</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#ffffff;
    color:#111827;
    min-height:100vh;
}

header{
    position:sticky;
    top:0;
    z-index:100;

    border-bottom:1px solid #e5e7eb;
    background:#ffffff;
}

.navbar{
    max-width:1000px;
    min-height:70px;
    margin:auto;
    padding:0 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;
}

.logo{
    color:#111827;
    text-decoration:none;
    font-size:21px;
    font-weight:900;
}

.logo span{
    color:#16a34a;
}

.back-btn{
    text-decoration:none;

    color:#ffffff;

    background:#16a34a;

    border:1px solid #15803d;

    padding:9px 13px;

    border-radius:9px;

    font-size:12px;
    font-weight:700;

    transition:.2s;
}

.back-btn:hover{
    background:#15803d;
    transform:translateY(-1px);
}

.container{
    max-width:950px;
    margin:auto;
    padding:30px 15px 60px;
}

.loading{
    text-align:center;
    color:#64748b;
    padding:70px 20px;
}

.product-box{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:25px;

    background:#ffffff;

    border:1px solid #e5e7eb;

    border-radius:20px;

    padding:20px;

    box-shadow:0 10px 35px rgba(0,0,0,.07);
}

.product-image-box{
    min-height:350px;

    border-radius:15px;

    overflow:hidden;

    background:#f0fdf4;

    border:1px solid #dcfce7;

    display:flex;

    align-items:center;

    justify-content:center;
}

.product-image{
    width:100%;
    height:100%;

    min-height:350px;

    object-fit:contain;

    display:block;
}

.product-info{
    display:flex;

    flex-direction:column;

    justify-content:center;
}

.category{
    display:inline-block;

    width:max-content;

    color:#ffffff;

    background:#16a34a;

    border:1px solid #15803d;

    padding:6px 10px;

    border-radius:7px;

    font-size:11px;

    font-weight:800;

    margin-bottom:13px;
}

.product-name{
    color:#111827;

    font-size:29px;

    line-height:1.2;

    font-weight:900;

    margin-bottom:15px;
}

.description{
    color:#64748b;

    font-size:14px;

    line-height:1.7;

    white-space:pre-line;

    margin-bottom:20px;
}

.price{
    color:#15803d;

    font-size:28px;

    font-weight:900;

    margin-bottom:18px;
}

.wallet{
    padding:14px;

    border-radius:12px;

    background:#16a34a;

    border:1px solid #15803d;

    margin-bottom:15px;
}

.wallet-label{
    color:rgba(255,255,255,.85);

    font-size:11px;

    margin-bottom:5px;
}

.wallet-balance{
    color:#ffffff;

    font-size:21px;

    font-weight:900;
}

.buy-btn{
    width:100%;

    border:none;

    color:#ffffff;

    background:#16a34a;

    padding:14px;

    border-radius:10px;

    cursor:pointer;

    font-size:14px;

    font-weight:900;

    transition:.2s;
}

.buy-btn:hover{
    background:#15803d;

    transform:translateY(-1px);

    box-shadow:0 7px 20px rgba(22,163,74,.25);
}

.buy-btn:disabled{
    opacity:.65;

    cursor:not-allowed;

    transform:none;

    box-shadow:none;
}

.continue{
    display:block;

    text-align:center;

    color:#64748b;

    text-decoration:none;

    margin-top:14px;

    font-size:12px;
}

.continue:hover{
    color:#16a34a;
}

.error{
    text-align:center;

    padding:60px 20px;

    background:#fef2f2;

    border:1px solid #fecaca;

    border-radius:15px;

    color:#dc2626;
}

.error h2{
    color:#111827;

    margin-bottom:8px;
}

.modal{
    position:fixed;

    inset:0;

    z-index:9999;

    background:rgba(0,0,0,.55);

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(420px,100%);

    background:#ffffff;

    border:1px solid #e5e7eb;

    border-radius:18px;

    padding:25px;

    text-align:center;

    box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.modal-title{
    color:#111827;

    font-size:21px;

    margin-bottom:12px;
}

.modal-message{
    color:#64748b;

    line-height:1.6;

    font-size:14px;

    margin-bottom:20px;

    white-space:pre-line;
}

.modal-btn{
    width:100%;

    border:none;

    color:#ffffff;

    background:#16a34a;

    padding:13px;

    border-radius:9px;

    cursor:pointer;

    font-weight:800;
}

.modal-btn:hover{
    background:#15803d;
}

.success{
    color:#16a34a !important;
}

.failure{
    color:#dc2626 !important;
}

@media(max-width:700px){

    .navbar{
        padding:0 12px;
    }

    .logo{
        font-size:19px;
    }

    .back-btn{
        padding:8px 10px;

        font-size:11px;
    }

    .container{
        padding:22px 10px 50px;
    }

    .product-box{
        grid-template-columns:1fr;

        gap:18px;

        padding:12px;

        border-radius:15px;
    }

    .product-image-box{
        min-height:280px;
    }

    .product-image{
        min-height:280px;
    }

    .product-name{
        font-size:24px;
    }

    .price{
        font-size:25px;
    }

}

@media(max-width:380px){

    .product-image-box{
        min-height:240px;
    }

    .product-image{
        min-height:240px;
    }

    .product-name{
        font-size:21px;
    }

}

</style>

</head>

<body>


<header>

    <div class="navbar">

        <a
            href="dashboard.html"
            class="logo"
        >
            Zavora <span>Social</span>
        </a>


        <a
            href="products.html"
            class="back-btn"
        >
            ← Products
        </a>

    </div>

</header>


<main class="container">


    <div
        id="loading"
        class="loading"
    >
        Loading product...
    </div>


    <div
        id="productArea"
        style="display:none;"
    >

        <div class="product-box">


            <div class="product-image-box">

                <img
                    id="productImage"
                    class="product-image"
                    src=""
                    alt="Product"
                >

            </div>


            <div class="product-info">


                <div
                    id="productCategory"
                    class="category"
                >
                    Product
                </div>


                <h1
                    id="productName"
                    class="product-name"
                >
                    Product
                </h1>


                <div
                    id="productDescription"
                    class="description"
                >
                    Loading description...
                </div>


                <div
                    id="productPrice"
                    class="price"
                >
                    ₦0.00
                </div>


                <div class="wallet">

                    <div class="wallet-label">
                        Your Wallet Balance
                    </div>

                    <div
                        id="walletBalance"
                        class="wallet-balance"
                    >
                        ₦0.00
                    </div>

                </div>


                <button
                    id="buyButton"
                    class="buy-btn"
                >
                    Buy Now
                </button>


                <a
                    href="products.html"
                    class="continue"
                >
                    ← Continue Shopping
                </a>


            </div>

        </div>

    </div>


    <div
        id="errorArea"
        class="error"
        style="display:none;"
    >

        <h2>
            Product Not Found
        </h2>

        <p id="errorText">
            This product could not be loaded.
        </p>

        <br>

        <a
            href="products.html"
            class="back-btn"
        >
            Back to Products
        </a>

    </div>

</main>



<div
    id="messageModal"
    class="modal"
>

    <div class="modal-box">


        <h2
            id="modalTitle"
            class="modal-title"
        >
            Purchase
        </h2>


        <p
            id="modalMessage"
            class="modal-message"
        >
            ...
        </p>


        <button
            id="modalButton"
            class="modal-btn"
        >
            Continue
        </button>


    </div>

</div>



<script type="module">


/*
==================================================
FIREBASE
==================================================
*/

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
    getDatabase,
    ref,
    get
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";



/*
==================================================
FIREBASE FUNCTIONS
==================================================
*/

import {
    getFunctions,
    httpsCallable
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-functions.js";



/*
==================================================
FIREBASE CONFIG
==================================================
*/

const firebaseConfig = {

    apiKey:
        "AIzaSyBzjZ9_rGqPW21duk4sxyLUO3hy3-6GwGs",

    authDomain:
        "zavorasocial.firebaseapp.com",

    databaseURL:
        "https://zavorasocial-default-rtdb.firebaseio.com/",

    projectId:
        "zavorasocial",

    storageBucket:
        "zavorasocial.firebasestorage.app",

    messagingSenderId:
        "447170165246",

    appId:
        "1:447170165246:web:982649e6533257ea0f28af",

    measurementId:
        "G-D4LNBEWH50"

};



/*
==================================================
INITIALIZE FIREBASE
==================================================
*/

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getDatabase(app);


/*
==================================================
FIREBASE FUNCTIONS
==================================================
*/

const functions =
    getFunctions(
        app,
        "us-central1"
    );


const purchaseProduct =
    httpsCallable(
        functions,
        "purchaseProduct"
    );



/*
==================================================
ELEMENTS
==================================================
*/

const loading =
    document.getElementById(
        "loading"
    );


const productArea =
    document.getElementById(
        "productArea"
    );


const errorArea =
    document.getElementById(
        "errorArea"
    );


const errorText =
    document.getElementById(
        "errorText"
    );


const productImage =
    document.getElementById(
        "productImage"
    );


const productName =
    document.getElementById(
        "productName"
    );


const productCategory =
    document.getElementById(
        "productCategory"
    );


const productDescription =
    document.getElementById(
        "productDescription"
    );


const productPrice =
    document.getElementById(
        "productPrice"
    );


const walletBalance =
    document.getElementById(
        "walletBalance"
    );


const buyButton =
    document.getElementById(
        "buyButton"
    );


const messageModal =
    document.getElementById(
        "messageModal"
    );


const modalTitle =
    document.getElementById(
        "modalTitle"
    );


const modalMessage =
    document.getElementById(
        "modalMessage"
    );


const modalButton =
    document.getElementById(
        "modalButton"
    );



/*
==================================================
GET PRODUCT ID
==================================================
*/

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const productId =
    urlParams.get("id");



/*
==================================================
CURRENT USER / PRODUCT
==================================================
*/

let currentUser =
    null;


let currentProduct =
    null;



/*
==================================================
MONEY FORMAT
==================================================
*/

function money(amount){

    return "₦" +

        Number(
            amount || 0
        ).toLocaleString(
            "en-NG",
            {
                minimumFractionDigits:2,

                maximumFractionDigits:2
            }
        );

}



/*
==================================================
SHOW MESSAGE
==================================================
*/

function showMessage(
    title,
    message,
    success = false,
    buttonText = "Continue",
    buttonAction = null
){

    modalTitle.textContent =
        title;


    modalMessage.textContent =
        message;


    modalTitle.className =
        "modal-title " +

        (
            success
                ? "success"
                : "failure"
        );


    modalButton.textContent =
        buttonText;


    modalButton.onclick =
        () => {

            if(
                typeof buttonAction ===
                "function"
            ){

                buttonAction();

                return;

            }


            messageModal.classList.remove(
                "show"
            );

        };


    messageModal.classList.add(
        "show"
    );

}



/*
==================================================
LOAD PRODUCT
==================================================
*/

async function loadProduct(){

    if(!productId){

        loading.style.display =
            "none";


        errorArea.style.display =
            "block";


        errorText.textContent =
            "No product was selected.";


        return;

    }


    try{

        const productRef =
            ref(
                db,
                "products/" +
                productId
            );


        const snapshot =
            await get(
                productRef
            );


        if(
            !snapshot.exists()
        ){

            loading.style.display =
                "none";


            errorArea.style.display =
                "block";


            errorText.textContent =
                "This product does not exist.";


            return;

        }


        const product =
            snapshot.val();


        if(
            product.active === false
        ){

            loading.style.display =
                "none";


            errorArea.style.display =
                "block";


            errorText.textContent =
                "This product is currently unavailable.";


            return;

        }


        currentProduct = {

            id:
                productId,

            ...product

        };


        productName.textContent =
            product.name ||
            "Unnamed Product";


        productCategory.textContent =
            product.category ||
            "Product";


        productDescription.textContent =
            product.description ||
            "Quality digital product available from Zavora Social.";


        productPrice.textContent =
            money(
                product.price
            );


        if(
            product.image
        ){

            productImage.src =
                product.image;

            productImage.style.display =
                "block";

        }
        else{

            productImage.style.display =
                "none";

        }


        loading.style.display =
            "none";


        productArea.style.display =
            "block";


        await loadWallet();

    }
    catch(error){

        console.error(
            "Product loading error:",
            error
        );


        loading.style.display =
            "none";


        errorArea.style.display =
            "block";


        errorText.textContent =
            "Unable to load this product. Please try again.";

    }

}



/*
==================================================
LOAD WALLET
==================================================
*/

async function loadWallet(){

    if(
        !currentUser
    ){

        return;

    }


    try{

        const walletRef =
            ref(
                db,
                "users/" +
                currentUser.uid +
                "/walletBalance"
            );


        const snapshot =
            await get(
                walletRef
            );


        const balance =
            Number(
                snapshot.val()
            ) || 0;


        walletBalance.textContent =
            money(
                balance
            );

    }
    catch(error){

        console.error(
            "Wallet loading error:",
            error
        );


        walletBalance.textContent =
            "₦0.00";

    }

}



/*
==================================================
BUY PRODUCT
==================================================
*/

buyButton.addEventListener(

    "click",

    async () => {


        if(
            !currentUser
        ){

            window.location.href =
                "login.html";

            return;

        }


        if(
            !currentProduct
        ){

            showMessage(
                "Purchase Failed",
                "Product information is not available."
            );

            return;

        }


        const price =
            Number(
                currentProduct.price
            ) || 0;


        if(
            price <= 0
        ){

            showMessage(
                "Purchase Failed",
                "This product has an invalid price."
            );

            return;

        }


        buyButton.disabled =
            true;


        buyButton.textContent =
            "Processing Purchase...";


        try{


            /*
            ========================================
            CALL SECURE FIREBASE FUNCTION
            ========================================
            */

            const result =
                await purchaseProduct({

                    productId:
                        currentProduct.id

                });


            const data =
                result.data || {};



            /*
            ========================================
            CHECK RESULT
            ========================================
            */

            if(
                !data.success
            ){

                throw new Error(
                    data.message ||
                    "Unable to complete your purchase."
                );

            }



            /*
            ========================================
            UPDATE WALLET
            ========================================
            */

            if(
                data.balance !== undefined
            ){

                walletBalance.textContent =
                    money(
                        data.balance
                    );

            }
            else{

                await loadWallet();

            }



            /*
            ========================================
            BUTTON
            ========================================
            */

            buyButton.disabled =
                true;


            buyButton.textContent =
                "Purchase Complete";



            /*
            ========================================
            DELIVERY
            ========================================
            */

            let deliveryMessage =
                "Your purchase was completed successfully.";


            if(
                data.deliveryDetails
            ){

                deliveryMessage +=
                    "\n\nDelivery:\n" +
                    data.deliveryDetails;

            }



            /*
            ========================================
            SUCCESS
            ========================================
            */

            showMessage(

                "Purchase Successful",

                deliveryMessage,

                true,

                "View My Orders",

                () => {

                    window.location.href =
                        "orders.html";

                }

            );

        }
        catch(error){

            console.error(
                "Purchase error:",
                error
            );


            let message =
                "Unable to complete your purchase. Please try again.";


            if(
                error &&
                error.message
            ){

                message =
                    error.message;

            }


            showMessage(

                "Purchase Failed",

                message,

                false,

                "Continue"

            );


            buyButton.disabled =
                false;


            buyButton.textContent =
                "Buy Now";

        }

    }

);



/*
==================================================
AUTH STATE
==================================================
*/

onAuthStateChanged(

    auth,

    async (user) => {


        if(
            !user
        ){

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            user;


        await loadProduct();

    }

);



/*
==================================================
CLOSE MODAL
==================================================
*/

messageModal.addEventListener(

    "click",

    (event) => {

        if(
            event.target ===
            messageModal
        ){

            messageModal.classList.remove(
                "show"
            );

        }

    }

);

</script>

</body>
</html>
