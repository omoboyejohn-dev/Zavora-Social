<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Zavora Social | Product</title><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    min-height:100vh;
    color:#fff;

    background:
        radial-gradient(
            circle at top left,
            rgba(124,58,237,.18),
            transparent 35%
        ),

        radial-gradient(
            circle at top right,
            rgba(6,182,212,.12),
            transparent 30%
        ),

        #080b16;
}


/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;

    background:rgba(8,11,22,.88);

    backdrop-filter:blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.08);
}


.navbar{
    max-width:1100px;
    min-height:70px;

    margin:auto;

    padding:0 20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;
}


.logo{
    color:#fff;

    text-decoration:none;

    font-size:22px;

    font-weight:900;
}


.logo span{

    background:
        linear-gradient(
            90deg,
            #a78bfa,
            #22d3ee
        );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

}


.back-btn{

    text-decoration:none;

    color:#cbd5e1;

    padding:10px 14px;

    border-radius:10px;

    background:
        rgba(255,255,255,.05);

    border:
        1px solid rgba(255,255,255,.08);

    font-size:13px;

    font-weight:700;
}


/* MAIN */

.container{

    max-width:1100px;

    margin:auto;

    padding:35px 20px 70px;
}


.product-box{

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);

    gap:30px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:24px;

    overflow:hidden;

    box-shadow:
        0 25px 70px rgba(0,0,0,.25);
}


/* IMAGE */

.product-image{

    min-height:450px;

    background:#111827;

    overflow:hidden;
}


.product-image img{

    width:100%;

    height:100%;

    min-height:450px;

    object-fit:cover;

    display:block;
}


/* DETAILS */

.product-details{

    padding:40px 35px;

    display:flex;

    flex-direction:column;

    justify-content:center;
}


.category{

    display:inline-block;

    width:max-content;

    color:#67e8f9;

    background:
        rgba(6,182,212,.08);

    border:
        1px solid rgba(6,182,212,.2);

    padding:7px 11px;

    border-radius:9px;

    font-size:12px;

    font-weight:800;

    margin-bottom:16px;
}


.product-name{

    font-size:36px;

    line-height:1.2;

    font-weight:900;

    margin-bottom:15px;
}


.price{

    color:#67e8f9;

    font-size:30px;

    font-weight:900;

    margin-bottom:20px;
}


.description{

    color:#94a3b8;

    line-height:1.7;

    font-size:15px;

    margin-bottom:25px;
}


/* WALLET */

.wallet-box{

    padding:17px;

    border-radius:14px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.08);

    margin-bottom:18px;
}


.wallet-label{

    color:#94a3b8;

    font-size:12px;

    margin-bottom:5px;
}


.wallet-balance{

    font-size:22px;

    font-weight:900;

    color:#fff;
}


/* BUY */

.buy-btn{

    width:100%;

    border:none;

    cursor:pointer;

    color:#fff;

    padding:15px;

    border-radius:12px;

    font-size:15px;

    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #06b6d4
        );
}


.buy-btn:disabled{

    opacity:.5;

    cursor:not-allowed;
}


/* BACK */

.continue{

    display:block;

    text-align:center;

    margin-top:15px;

    color:#94a3b8;

    text-decoration:none;

    font-size:13px;
}


/* LOADING */

.loading{

    max-width:600px;

    margin:70px auto;

    text-align:center;

    padding:50px;

    color:#94a3b8;
}


/* ERROR */

.error{

    max-width:600px;

    margin:70px auto;

    text-align:center;

    padding:50px;

    border:
        1px solid rgba(239,68,68,.2);

    border-radius:20px;

    background:
        rgba(239,68,68,.06);

    color:#fca5a5;
}


.error h2{

    color:#fff;

    margin-bottom:10px;
}


/* MESSAGE */

.message{

    position:fixed;

    inset:0;

    z-index:500;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.7);

    backdrop-filter:blur(8px);
}


.message-box{

    width:100%;

    max-width:420px;

    padding:30px;

    border-radius:20px;

    text-align:center;

    background:#101522;

    border:
        1px solid rgba(255,255,255,.1);
}


.message-icon{

    font-size:45px;

    margin-bottom:12px;
}


.message-box h2{

    margin-bottom:10px;
}


.message-box p{

    color:#94a3b8;

    line-height:1.6;

    margin-bottom:20px;
}


.message-btn{

    width:100%;

    border:none;

    color:#fff;

    padding:12px;

    border-radius:10px;

    cursor:pointer;

    font-weight:800;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #06b6d4
        );
}


/* MOBILE */

@media(max-width:800px){

    .product-box{

        grid-template-columns:1fr;

    }


    .product-image{

        min-height:300px;

    }


    .product-image img{

        min-height:300px;

    }


    .product-details{

        padding:30px 22px;

    }


    .product-name{

        font-size:29px;

    }

}

@media(max-width:500px){

    .container{

        padding:
            20px
            14px
            50px;

    }


    .product-image{

        min-height:260px;

    }


    .product-image img{

        min-height:260px;

    }

}

</style></head><body><header><div class="navbar">

    <a
        href="dashboard.html"
        class="logo"
    >
        Zavora <span>Social</span>
    </a>


    <a
        href="products.html"
        class="back-btn"
    >
        ← Products
    </a>

</div>

</header><main class="container"><div
    id="content"
    class="loading"
>

    Checking your account...

</div>

</main><div
    id="message"
    class="message"
><div class="message-box">

    <div
        id="messageIcon"
        class="message-icon"
    >
        ⚠️
    </div>


    <h2 id="messageTitle">
        Message
    </h2>


    <p id="messageText">
        Please wait...
    </p>


    <button
        id="messageButton"
        class="message-btn"
    >
        Continue
    </button>

</div>

</div><script type="module">


/* ==========================================
   FIREBASE
========================================== */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
    getDatabase,
    ref,
    get
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyBzjZ9_rGqPW21duk4sxyLUO3hy3-6GwGs",

    authDomain:
        "zavorasocial.firebaseapp.com",

    databaseURL:
        "https://zavorasocial-default-rtdb.firebaseio.com/",

    projectId:
        "zavorasocial",

    storageBucket:
        "zavorasocial.firebasestorage.app",

    messagingSenderId:
        "447170165246",

    appId:
        "1:447170165246:web:982649e6533257ea0f28af",

    measurementId:
        "G-D4LNBEWH50"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getDatabase(app);


/* ==========================================
   ELEMENTS
========================================== */

const content =
    document.getElementById(
        "content"
    );


const message =
    document.getElementById(
        "message"
    );


const messageIcon =
    document.getElementById(
        "messageIcon"
    );


const messageTitle =
    document.getElementById(
        "messageTitle"
    );


const messageText =
    document.getElementById(
        "messageText"
    );


const messageButton =
    document.getElementById(
        "messageButton"
    );


/* ==========================================
   PRODUCT ID
========================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const productId =
    params.get("id");


/* ==========================================
   AUTHENTICATION
========================================== */

/*
 * IMPORTANT:
 *
 * We do not redirect immediately.
 *
 * Firebase needs a moment to restore the
 * existing login session when moving from
 * products.html to product.html.
 *
 * onAuthStateChanged fires after Firebase
 * has completed that check.
 */

onAuthStateChanged(
    auth,
    async (user) => {

        console.log(
            "Zavora authentication:",
            user
                ? user.email
                : "No authenticated user"
        );


        if(!user){

            /*
             * Firebase has finished checking.
             * The customer is genuinely logged out.
             */

            window.location.replace(
                "login.html"
            );

            return;

        }


        /*
         * Customer is authenticated.
         */

        if(!productId){

            showError(
                "Product not found",
                "No product was selected."
            );

            return;

        }


        await loadProduct(user);

    }
);


/* ==========================================
   LOAD PRODUCT
========================================== */

async function loadProduct(user){

    try{

        const productRef =
            ref(
                db,
                "products/" +
                productId
            );


        const snapshot =
            await get(productRef);


        if(!snapshot.exists()){

            showError(
                "Product not found",
                "This product may have been removed."
            );

            return;

        }


        const product =
            snapshot.val();


        if(product.active !== true){

            showError(
                "Product unavailable",
                "This product is currently unavailable."
            );

            return;

        }


        renderProduct(
            product,
            user
        );

    }
    catch(error){

        console.error(
            "Product loading error:",
            error
        );


        showError(
            "Unable to load product",
            "Please refresh the page and try again."
        );

    }

}


/* ==========================================
   RENDER
========================================== */

function renderProduct(
    product,
    user
){

    const image =
        product.image ||
        "https://via.placeholder.com/700x600?text=Zavora";


    const name =
        product.name ||
        "Unnamed Product";


    const price =
        Number(
            product.price || 0
        );


    const category =
        product.category ||
        "Product";


    const description =
        product.description ||
        "Quality digital product available on Zavora Social.";


    content.className =
        "product-box";


    content.innerHTML = `

        <div class="product-image">

            <img
                id="productImage"
                src="${escapeHtml(image)}"
                alt="${escapeHtml(name)}"
            >

        </div>


        <div class="product-details">

            <div class="category">

                📦
                ${escapeHtml(category)}

            </div>


            <h1 class="product-name">

                ${escapeHtml(name)}

            </h1>


            <div class="price">

                ₦${formatNumber(price)}

            </div>


            <div class="description">

                ${escapeHtml(description)}

            </div>


            <div class="wallet-box">

                <div class="wallet-label">

                    Your Wallet Balance

                </div>


                <div
                    id="walletBalance"
                    class="wallet-balance"
                >

                    Checking...

                </div>

            </div>


            <button
                id="buyButton"
                class="buy-btn"
                type="button"
            >

                Buy Now — ₦${formatNumber(price)}

            </button>


            <a
                href="products.html"
                class="continue"
            >

                ← Continue Shopping

            </a>

        </div>

    `;


    document
        .getElementById(
            "productImage"
        )
        .addEventListener(
            "error",
            function(){

                this.src =
                    "https://via.placeholder.com/700x600?text=Zavora";

            }
        );


    loadWallet(user);


    /*
     * Purchase logic is intentionally not
     * added here yet.
     *
     * First we make sure authentication and
     * product navigation work correctly.
     */

}


/* ==========================================
   WALLET
========================================== */

async function loadWallet(user){

    const walletBalance =
        document.getElementById(
            "walletBalance"
        );


    if(!walletBalance){

        return;

    }


    try{

        const walletRef =
            ref(
                db,
                "users/" +
                user.uid +
                "/walletBalance"
            );


        const snapshot =
            await get(walletRef);


        const balance =
            snapshot.exists()
            ? Number(
                snapshot.val() || 0
            )
            : 0;


        walletBalance.textContent =
            "₦" +
            formatNumber(
                balance
            );

    }
    catch(error){

        console.error(
            "Wallet error:",
            error
        );


        walletBalance.textContent =
            "Unavailable";

    }

}


/* ==========================================
   ERROR
========================================== */

function showError(
    title,
    text
){

    content.className =
        "error";


    content.innerHTML = `

        <div style="font-size:45px;margin-bottom:10px">
            ⚠️
        </div>

        <h2>
            ${escapeHtml(title)}
        </h2>

        <p>
            ${escapeHtml(text)}
        </p>

        <br>

        <a
            href="products.html"
            style="
                color:#67e8f9;
                text-decoration:none;
                font-weight:800;
            "
        >
            ← Back to Products
        </a>

    `;

}


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
    icon,
    title,
    text
){

    messageIcon.textContent =
        icon;

    messageTitle.textContent =
        title;

    messageText.textContent =
        text;

    message.style.display =
        "flex";

}


messageButton.addEventListener(
    "click",
    () => {

        message.style.display =
            "none";

    }
);


/* ==========================================
   FORMAT
========================================== */

function formatNumber(value){

    return Number(value)
        .toLocaleString(
            "en-NG",
            {
                maximumFractionDigits:2
            }
        );

}


/* ==========================================
   ESCAPE
========================================== */

function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

</script></body></html>
