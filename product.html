<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zavora Social | Product</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#080b16;
    color:#fff;
    min-height:100vh;
}

header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:#0d1122;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:22px;
    font-weight:800;
    background:linear-gradient(90deg,#8b5cf6,#22d3ee);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.back-btn{
    border:0;
    background:#171c32;
    color:#fff;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
}

.container{
    max-width:900px;
    margin:35px auto;
    padding:0 18px;
}

.product-card{
    background:#101528;
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.product-image{
    width:100%;
    height:350px;
    object-fit:contain;
    background:#080b16;
    display:block;
}

.product-content{
    padding:25px;
}

.category{
    display:inline-block;
    background:rgba(139,92,246,.15);
    color:#b794ff;
    padding:7px 12px;
    border-radius:20px;
    font-size:13px;
    margin-bottom:12px;
}

h1{
    font-size:28px;
    margin-bottom:12px;
}

.price{
    font-size:25px;
    font-weight:800;
    color:#22d3ee;
    margin-bottom:15px;
}

.stock{
    color:#9ca3af;
    margin-bottom:22px;
}

.buy-btn{
    width:100%;
    padding:16px;
    border:0;
    border-radius:12px;
    background:linear-gradient(90deg,#7c3aed,#06b6d4);
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.buy-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.status{
    text-align:center;
    margin:20px 0;
    color:#9ca3af;
}

.message{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.message-box{
    width:100%;
    max-width:450px;
    background:#101528;
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
    padding:25px;
    text-align:center;
}

.message-box h2{
    margin-bottom:12px;
}

.message-box p{
    color:#cbd5e1;
    line-height:1.6;
    word-break:break-word;
}

.close-btn{
    margin-top:20px;
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#171c32;
    color:#fff;
    cursor:pointer;
}

.loading{
    text-align:center;
    padding:60px 20px;
    color:#9ca3af;
}

.error{
    text-align:center;
    padding:50px 20px;
    color:#f87171;
}

@media(max-width:600px){
    .product-image{
        height:260px;
    }

    h1{
        font-size:23px;
    }

    .product-content{
        padding:20px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">ZAVORA SOCIAL</div>

    <button class="back-btn" id="backBtn">
        ← Back
    </button>
</header>

<div class="container">

    <div id="loading" class="loading">
        Loading product...
    </div>

    <div id="productArea" style="display:none;">

        <div class="product-card">

            <img
                id="productImage"
                class="product-image"
                src=""
                alt="Product"
            >

            <div class="product-content">

                <span id="productCategory" class="category">
                    Product
                </span>

                <h1 id="productName">
                    Product
                </h1>

                <div id="productPrice" class="price">
                    ₦0.00
                </div>

                <div id="productStock" class="stock">
                    Checking stock...
                </div>

                <button id="buyBtn" class="buy-btn">
                    BUY NOW
                </button>

            </div>

        </div>

    </div>

    <div id="errorArea" class="error" style="display:none;"></div>

</div>


<div id="message" class="message">

    <div class="message-box">

        <h2 id="messageTitle">
            Zavora Social
        </h2>

        <p id="messageText"></p>

        <button id="closeMessage" class="close-btn">
            Close
        </button>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    get,
    transaction,
    push,
    set
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
    apiKey: "AIzaSyBzj9_RgQPW21duk4sxyLUO3hy3-6GwGs",
    authDomain: "zavorasocial.firebaseapp.com",
    databaseURL: "https://zavorasocial-default-rtdb.firebaseio.com/",
    projectId: "zavorasocial",
    storageBucket: "zavorasocial.firebasestorage.app",
    messagingSenderId: "447170165246",
    appId: "1:447170165246:web:982649e6533257ea0f28af",
    measurementId: "G-D4LNBEWH50"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


/* =========================
   ELEMENTS
========================= */

const loading = document.getElementById("loading");
const productArea = document.getElementById("productArea");
const errorArea = document.getElementById("errorArea");

const productImage = document.getElementById("productImage");
const productName = document.getElementById("productName");
const productCategory = document.getElementById("productCategory");
const productPrice = document.getElementById("productPrice");
const productStock = document.getElementById("productStock");

const buyBtn = document.getElementById("buyBtn");

const message = document.getElementById("message");
const messageTitle = document.getElementById("messageTitle");
const messageText = document.getElementById("messageText");
const closeMessage = document.getElementById("closeMessage");

const backBtn = document.getElementById("backBtn");


/* =========================
   PRODUCT ID
========================= */

const params = new URLSearchParams(window.location.search);

const productId = params.get("id");


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let currentProduct = null;


/* =========================
   BACK BUTTON
========================= */

backBtn.addEventListener("click", () => {

    window.location.replace("products.html");

});


/* =========================
   MESSAGE
========================= */

function showMessage(title, text){

    messageTitle.textContent = title;
    messageText.textContent = text;

    message.style.display = "flex";

}


closeMessage.addEventListener("click", () => {

    message.style.display = "none";

});


/* =========================
   ERROR
========================= */

function showError(text){

    loading.style.display = "none";
    productArea.style.display = "none";

    errorArea.textContent = text;
    errorArea.style.display = "block";

}


/* =========================
   AUTHENTICATION
========================= */

/*
   IMPORTANT:
   We do NOT redirect immediately.

   Firebase needs time to restore the
   existing login session.
*/

let authResolved = false;

const authTimeout = setTimeout(() => {

    if(authResolved) return;

    console.log("Firebase authentication is still loading.");

    showError(
        "Unable to restore your login session. Please refresh the page and try again."
    );

}, 10000);


onAuthStateChanged(auth, async (user) => {

    console.log(
        "Zavora Firebase user:",
        user ? user.email : "NO USER"
    );

    if(authResolved) return;

    authResolved = true;

    clearTimeout(authTimeout);


    if(!user){

        /*
           Save the product page so login can
           return here later.
        */

        const redirectPage =
            "product.html?id=" +
            encodeURIComponent(productId || "");

        const loginUrl =
            "login.html?redirect=" +
            encodeURIComponent(redirectPage);

        window.location.replace(loginUrl);

        return;
    }


    currentUser = user;


    if(!productId){

        showError("Product was not found.");

        return;
    }


    await loadProduct();

});


/* =========================
   LOAD PRODUCT
========================= */

async function loadProduct(){

    try{

        const snapshot =
            await get(ref(db, "products/" + productId));


        if(!snapshot.exists()){

            showError("This product does not exist.");

            return;
        }


        const product =
            snapshot.val();


        if(product.active === false){

            showError("This product is currently unavailable.");

            return;
        }


        currentProduct = {
            id: productId,
            ...product
        };


        productName.textContent =
            product.name || "Product";


        productCategory.textContent =
            product.category || "General";


        const price =
            Number(product.price || 0);


        productPrice.textContent =
            "₦" +
            price.toLocaleString("en-NG", {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            });


        productImage.src =
            product.image ||
            "https://via.placeholder.com/700x400?text=Zavora+Social";


        productImage.onerror = () => {

            productImage.src =
                "https://via.placeholder.com/700x400?text=Zavora+Social";

        };


        await checkStock();


        loading.style.display = "none";
        productArea.style.display = "block";


    }catch(error){

        console.error("Product loading error:", error);

        showError(
            "Unable to load this product. Please try again."
        );

    }

}


/* =========================
   CHECK STOCK
========================= */

async function checkStock(){

    try{

        const snapshot =
            await get(ref(db, "inventory/" + productId));


        if(!snapshot.exists()){

            productStock.textContent =
                "Available";

            buyBtn.disabled = false;

            return;
        }


        const inventory =
            snapshot.val();


        let available = 0;


        Object.values(inventory).forEach(item => {

            if(
                item &&
                item.status === "available" &&
                typeof item.details === "string" &&
                item.details.trim() !== ""
            ){

                available++;

            }

        });


        if(available > 0){

            productStock.textContent =
                available + " available";

            buyBtn.disabled = false;

        }else{

            productStock.textContent =
                "Out of stock";

            buyBtn.disabled = true;

        }


    }catch(error){

        console.error("Stock error:", error);

        /*
           Don't block normal products if
           inventory hasn't been created yet.
        */

        productStock.textContent =
            "Available";

        buyBtn.disabled = false;

    }

}


/* =========================
   BUY PRODUCT
========================= */

buyBtn.addEventListener("click", async () => {

    if(!currentUser){

        showMessage(
            "Login Required",
            "Please login before buying this product."
        );

        return;
    }


    if(!currentProduct){

        showMessage(
            "Error",
            "Product information is not ready."
        );

        return;
    }


    buyBtn.disabled = true;

    buyBtn.textContent =
        "PROCESSING...";


    try{

        /* =====================
           GET USER WALLET
        ===================== */

        const userSnapshot =
            await get(
                ref(
                    db,
                    "users/" + currentUser.uid
                )
            );


        const userData =
            userSnapshot.exists()
                ? userSnapshot.val()
                : {};


        const walletBalance =
            Number(userData.walletBalance || 0);


        const price =
            Number(currentProduct.price || 0);


        if(walletBalance < price){

            showMessage(
                "Insufficient Balance",
                "Your wallet balance is ₦" +
                walletBalance.toLocaleString("en-NG") +
                ". Please deposit money into your wallet before buying this product."
            );

            buyBtn.disabled = false;
            buyBtn.textContent = "BUY NOW";

            return;
        }


        /* =====================
           FIND INVENTORY ITEM
        ===================== */

        const inventoryRef =
            ref(
                db,
                "inventory/" + productId
            );


        const inventorySnapshot =
            await get(inventoryRef);


        let selectedItemId = null;
        let selectedDetails = null;


        if(inventorySnapshot.exists()){

            const inventory =
                inventorySnapshot.val();


            for(const itemId in inventory){

                const item =
                    inventory[itemId];


                if(
                    item &&
                    item.status === "available" &&
                    typeof item.details === "string" &&
                    item.details.trim() !== ""
                ){

                    selectedItemId = itemId;

                    selectedDetails =
                        item.details.trim();

                    break;

                }

            }

        }


        /*
           If inventory exists for this product,
           there must be an available item.
        */

        if(
            inventorySnapshot.exists() &&
            !selectedItemId
        ){

            showMessage(
                "Out of Stock",
                "Sorry, this product is currently out of stock."
            );

            buyBtn.disabled = false;
            buyBtn.textContent = "BUY NOW";

            return;
        }


        /* =====================
           RESERVE INVENTORY
        ===================== */

        if(selectedItemId){

            const itemRef =
                ref(
                    db,
                    "inventory/" +
                    productId +
                    "/" +
                    selectedItemId
                );


            const result =
                await transaction(
                    itemRef,
                    item => {

                        if(!item) return;

                        if(item.status !== "available")
                            return;

                        return {
                            ...item,
                            status: "processing"
                        };

                    }
                );


            if(!result.committed){

                throw new Error(
                    "This product was just purchased by another customer."
                );

            }

        }


        /* =====================
           DEDUCT WALLET
        ===================== */

        const walletRef =
            ref(
                db,
                "users/" +
                currentUser.uid +
                "/walletBalance"
            );


        const walletResult =
            await transaction(
                walletRef,
                balance => {

                    const current =
                        Number(balance || 0);


                    if(current < price){

                        return;

                    }


                    return current - price;

                }
            );


        if(!walletResult.committed){

            /*
               Return inventory to available
               if wallet deduction failed.
            */

            if(selectedItemId){

                await set(
                    ref(
                        db,
                        "inventory/" +
                        productId +
                        "/" +
                        selectedItemId +
                        "/status"
                    ),
                    "available"
                );

            }


            throw new Error(
                "Insufficient wallet balance."
            );

        }


        /* =====================
           CREATE ORDER
        ===================== */

        const orderRef =
            push(
                ref(db, "orders")
            );


        const orderData = {

            uid: currentUser.uid,

            email:
                currentUser.email || "",

            productId:
                productId,

            productName:
                currentProduct.name || "",

            category:
                currentProduct.category || "",

            amount:
                price,

            paymentMethod:
                "Wallet",

            inventoryItemId:
                selectedItemId || "",

            itemDetails:
                selectedDetails || "",

            status:
                "completed",

            createdAt:
                Date.now()

        };


        await set(
            orderRef,
            orderData
        );


        /* =====================
           MARK INVENTORY SOLD
        ===================== */

        if(selectedItemId){

            await set(
                ref(
                    db,
                    "inventory/" +
                    productId +
                    "/" +
                    selectedItemId
                ),
                {
                    details:
                        selectedDetails,

                    status:
                        "sold",

                    soldTo:
                        currentUser.uid,

                    soldAt:
                        Date.now()
                }
            );

        }


        /* =====================
           SUCCESS
        ===================== */

        let successText =
            "Your payment of ₦" +
            price.toLocaleString("en-NG") +
            " was successful.";


        if(selectedDetails){

            successText +=
                "\n\nYour delivered item:\n" +
                selectedDetails;

        }


        showMessage(
            "Purchase Successful 🎉",
            successText
        );


        await checkStock();


    }catch(error){

        console.error(
            "Purchase error:",
            error
        );


        showMessage(
            "Purchase Failed",
            error.message ||
            "Something went wrong. Please try again."
        );


        await checkStock();

    }


    buyBtn.disabled =
        productStock.textContent === "Out of stock";


    buyBtn.textContent =
        "BUY NOW";

});


</script>

</body>
</html>
