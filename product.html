<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zavora Social | Product</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#ffffff;
    color:#111827;
    min-height:100vh;
}

header{
    position:sticky;
    top:0;
    z-index:100;

    background:#ffffff;
    border-bottom:1px solid #e5e7eb;
}

.navbar{
    max-width:1100px;
    min-height:70px;
    margin:auto;
    padding:0 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    color:#111827;
    text-decoration:none;
    font-size:21px;
    font-weight:900;
}

.logo span{
    color:#7e22ce;
}

.back-btn{
    text-decoration:none;

    color:#ffffff;

    background:linear-gradient(
        135deg,
        #7e22ce,
        #2563eb
    );

    padding:9px 13px;

    border-radius:9px;

    font-size:12px;
    font-weight:800;

    transition:.2s;
}

.back-btn:hover{
    transform:translateY(-1px);

    box-shadow:0 6px 18px rgba(37,99,235,.18);
}

.container{
    width:min(1050px,92%);
    margin:30px auto 60px;
}

.loading{
    text-align:center;

    color:#64748b;

    padding:70px 20px;

    background:#faf5ff;

    border:1px solid #ede9fe;

    border-radius:18px;
}

.product-box{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:28px;

    background:#ffffff;

    border:1px solid #e5e7eb;

    border-radius:20px;

    padding:20px;

    box-shadow:0 12px 40px rgba(15,23,42,.07);
}

.product-image-box{
    min-height:390px;

    border-radius:16px;

    overflow:hidden;

    background:#faf5ff;

    display:flex;

    align-items:center;
    justify-content:center;

    border:1px solid #ede9fe;
}

.product-image{
    width:100%;
    height:100%;

    min-height:390px;

    object-fit:contain;

    display:block;
}

.product-info{
    display:flex;

    flex-direction:column;

    justify-content:center;

    padding:10px 5px;
}

.category{
    display:inline-block;

    width:max-content;

    color:#ffffff;

    background:linear-gradient(
        135deg,
        #7e22ce,
        #2563eb
    );

    padding:6px 10px;

    border-radius:7px;

    font-size:11px;
    font-weight:900;

    margin-bottom:14px;
}

.product-name{
    color:#111827;

    font-size:30px;

    line-height:1.2;

    font-weight:900;

    margin-bottom:15px;
}

.description{
    color:#64748b;

    font-size:14px;

    line-height:1.7;

    white-space:pre-line;

    margin-bottom:20px;
}

.price{
    color:#6d28d9;

    font-size:29px;

    font-weight:900;

    margin-bottom:18px;
}

.wallet{
    padding:15px;

    border-radius:13px;

    background:linear-gradient(
        135deg,
        #7e22ce,
        #2563eb
    );

    margin-bottom:15px;

    box-shadow:0 8px 22px rgba(37,99,235,.12);
}

.wallet-label{
    color:rgba(255,255,255,.82);

    font-size:11px;

    margin-bottom:5px;
}

.wallet-balance{
    color:#ffffff;

    font-size:22px;

    font-weight:900;
}

.buy-btn{
    width:100%;

    border:none;

    color:#ffffff;

    background:linear-gradient(
        135deg,
        #7e22ce,
        #2563eb
    );

    padding:14px;

    border-radius:10px;

    cursor:pointer;

    font-size:14px;

    font-weight:900;

    transition:.2s;
}

.buy-btn:hover{
    transform:translateY(-1px);

    box-shadow:0 8px 22px rgba(37,99,235,.22);
}

.buy-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

.continue{
    display:block;

    text-align:center;

    color:#64748b;

    text-decoration:none;

    margin-top:14px;

    font-size:12px;
}

.continue:hover{
    color:#7e22ce;
}

.error{
    text-align:center;

    padding:60px 20px;

    background:#fef2f2;

    border:1px solid #fecaca;

    border-radius:17px;

    color:#dc2626;
}

.error h2{
    color:#111827;
    margin-bottom:8px;
}

.modal{
    position:fixed;

    inset:0;

    z-index:9999;

    background:rgba(15,23,42,.58);

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(430px,100%);

    background:#ffffff;

    border:1px solid #e5e7eb;

    border-radius:19px;

    padding:26px;

    text-align:center;

    box-shadow:0 25px 70px rgba(0,0,0,.20);
}

.modal-title{
    color:#111827;

    font-size:21px;

    margin-bottom:12px;
}

.modal-message{
    color:#64748b;

    line-height:1.65;

    font-size:14px;

    margin-bottom:20px;

    white-space:pre-line;
}

.modal-btn{
    width:100%;

    border:none;

    color:#ffffff;

    background:linear-gradient(
        135deg,
        #7e22ce,
        #2563eb
    );

    padding:13px;

    border-radius:9px;

    cursor:pointer;

    font-weight:900;
}

.modal-btn:hover{
    box-shadow:0 7px 20px rgba(37,99,235,.20);
}

.success{
    color:#16a34a !important;
}

.failure{
    color:#dc2626 !important;
}

@media(max-width:700px){

    .navbar{
        min-height:64px;
        padding:0 12px;
    }

    .logo{
        font-size:19px;
    }

    .back-btn{
        padding:8px 10px;
        font-size:10px;
    }

    .container{
        width:calc(100% - 20px);
        margin:22px auto 50px;
    }

    .product-box{
        grid-template-columns:1fr;

        gap:20px;

        padding:12px;

        border-radius:17px;
    }

    .product-image-box{
        min-height:280px;
    }

    .product-image{
        min-height:280px;
    }

    .product-info{
        padding:5px 3px 8px;
    }

    .product-name{
        font-size:24px;
    }

    .price{
        font-size:26px;
    }

}

</style>

</head>

<body>

<header>

<div class="navbar">

<a href="dashboard.html" class="logo">
    Zavora <span>Social</span>
</a>

<a href="products.html" class="back-btn">
    ← Products
</a>

</div>

</header>

<main class="container">

<div id="loading" class="loading">
    Loading product...
</div>

<div id="productArea" style="display:none;">

<div class="product-box">

<div class="product-image-box">

<img
    id="productImage"
    class="product-image"
    src=""
    alt="Product"
>

</div>

<div class="product-info">

<div id="productCategory" class="category">
    Product
</div>

<h1 id="productName" class="product-name">
    Product
</h1>

<div id="productDescription" class="description">
    Loading description...
</div>

<div id="productPrice" class="price">
    ₦0.00
</div>

<div class="wallet">

<div class="wallet-label">
    Your Wallet Balance
</div>

<div id="walletBalance" class="wallet-balance">
    ₦0.00
</div>

</div>

<button
    id="buyButton"
    class="buy-btn"
>
    Buy Now
</button>

<a
    href="products.html"
    class="continue"
>
    ← Continue Shopping
</a>

</div>

</div>

</div>

<div
    id="errorArea"
    class="error"
    style="display:none;"
>

<h2>
    Product Not Found
</h2>

<p id="errorText">
    This product could not be loaded.
</p>

<br>

<a
    href="products.html"
    class="back-btn"
>
    Back to Products
</a>

</div>

</main>

<div
    id="messageModal"
    class="modal"
>

<div class="modal-box">

<h2
    id="modalTitle"
    class="modal-title"
>
    Purchase
</h2>

<p
    id="modalMessage"
    class="modal-message"
>
    ...
</p>

<button
    id="modalButton"
    class="modal-btn"
>
    Continue
</button>

</div>

</div>

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    get
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyBzjZ9_rGqPW21duk4sxyLUO3hy3-6GwGs",

    authDomain:
        "zavorasocial.firebaseapp.com",

    databaseURL:
        "https://zavorasocial-default-rtdb.firebaseio.com/",

    projectId:
        "zavorasocial",

    storageBucket:
        "zavorasocial.firebasestorage.app",

    messagingSenderId:
        "447170165246",

    appId:
        "1:447170165246:web:982649e6533257ea0f28af",

    measurementId:
        "G-D4LNBEWH50"

};


const app =
    initializeApp(
        firebaseConfig
    );

const auth =
    getAuth(app);

const db =
    getDatabase(app);


const loading =
    document.getElementById(
        "loading"
    );

const productArea =
    document.getElementById(
        "productArea"
    );

const errorArea =
    document.getElementById(
        "errorArea"
    );

const errorText =
    document.getElementById(
        "errorText"
    );

const productImage =
    document.getElementById(
        "productImage"
    );

const productName =
    document.getElementById(
        "productName"
    );

const productCategory =
    document.getElementById(
        "productCategory"
    );

const productDescription =
    document.getElementById(
        "productDescription"
    );

const productPrice =
    document.getElementById(
        "productPrice"
    );

const walletBalance =
    document.getElementById(
        "walletBalance"
    );

const buyButton =
    document.getElementById(
        "buyButton"
    );

const messageModal =
    document.getElementById(
        "messageModal"
    );

const modalTitle =
    document.getElementById(
        "modalTitle"
    );

const modalMessage =
    document.getElementById(
        "modalMessage"
    );

const modalButton =
    document.getElementById(
        "modalButton"
    );


const urlParams =
    new URLSearchParams(
        window.location.search
    );

const productId =
    urlParams.get("id");


let currentUser =
    null;

let currentProduct =
    null;


function money(amount){

    return "₦" +
        Number(
            amount || 0
        ).toLocaleString(
            "en-NG",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


function showMessage(
    title,
    message,
    success = false,
    buttonText = "Continue",
    buttonAction = null
){

    modalTitle.textContent =
        title;

    modalMessage.textContent =
        message;

    modalTitle.className =
        "modal-title " +
        (
            success
                ? "success"
                : "failure"
        );

    modalButton.textContent =
        buttonText;

    modalButton.onclick =
        () => {

            if(
                typeof buttonAction ===
                "function"
            ){

                buttonAction();

                return;

            }

            messageModal.classList.remove(
                "show"
            );

        };

    messageModal.classList.add(
        "show"
    );

}


async function loadProduct(){

    if(!productId){

        loading.style.display =
            "none";

        errorArea.style.display =
            "block";

        errorText.textContent =
            "No product was selected.";

        return;

    }

    try{

        const productRef =
            ref(
                db,
                "products/" +
                productId
            );

        const snapshot =
            await get(
                productRef
            );

        if(
            !snapshot.exists()
        ){

            loading.style.display =
                "none";

            errorArea.style.display =
                "block";

            errorText.textContent =
                "This product does not exist.";

            return;

        }

        const product =
            snapshot.val();

        if(
            product.active === false
        ){

            loading.style.display =
                "none";

            errorArea.style.display =
                "block";

            errorText.textContent =
                "This product is currently unavailable.";

            return;

        }

        currentProduct = {

            id:
                productId,

            ...product

        };


        productName.textContent =
            product.name ||
            "Unnamed Product";

        productCategory.textContent =
            product.category ||
            "Product";

        productDescription.textContent =
            product.description ||
            "Quality digital product available from Zavora Social.";

        productPrice.textContent =
            money(
                product.price
            );


        if(
            product.image
        ){

            productImage.src =
                product.image;

            productImage.style.display =
                "block";

        }
        else{

            productImage.style.display =
                "none";

        }


        productImage.onerror =
            () => {

                productImage.style.display =
                    "none";

            };


        loading.style.display =
            "none";

        productArea.style.display =
            "block";


        await loadWallet();

    }
    catch(error){

        console.error(
            "Product loading error:",
            error
        );

        loading.style.display =
            "none";

        errorArea.style.display =
            "block";

        errorText.textContent =
            "Unable to load this product. Please try again.";

    }

}


async function loadWallet(){

    if(
        !currentUser
    ){

        return;

    }

    try{

        const walletRef =
            ref(
                db,
                "users/" +
                currentUser.uid +
                "/walletBalance"
            );

        const snapshot =
            await get(
                walletRef
            );

        const balance =
            Number(
                snapshot.val()
            ) || 0;

        walletBalance.textContent =
            money(
                balance
            );

    }
    catch(error){

        console.error(
            "Wallet loading error:",
            error
        );

        walletBalance.textContent =
            "₦0.00";

    }

}


buyButton.addEventListener(
    "click",
    async () => {

        if(
            !currentUser
        ){

            window.location.href =
                "login.html";

            return;

        }

        if(
            !currentProduct
        ){

            showMessage(
                "Purchase Failed",
                "Product information is not available."
            );

            return;

        }

        const price =
            Number(
                currentProduct.price
            ) || 0;

        if(
            price <= 0
        ){

            showMessage(
                "Purchase Failed",
                "This product has an invalid price."
            );

            return;

        }

        buyButton.disabled =
            true;

        buyButton.textContent =
            "Processing Purchase...";


        try{

            const idToken =
                await currentUser.getIdToken(
                    true
                );


            const response =
                await fetch(
                    "/api/purchase",
                    {
                        method:
                            "POST",

                        headers:{
                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " +
                                idToken
                        },

                        body:
                            JSON.stringify({
                                productId:
                                    currentProduct.id
                            })
                    }
                );


            let result =
                null;

            try{

                result =
                    await response.json();

            }
            catch(
                jsonError
            ){

                console.error(
                    "Invalid API response:",
                    jsonError
                );

            }


            if(
                !response.ok ||
                !result ||
                !result.success
            ){

                const message =
                    result &&
                    result.message
                        ? result.message
                        : "Unable to complete your purchase. Please try again.";

                showMessage(
                    "Purchase Failed",
                    message,
                    false,
                    "Continue"
                );

                buyButton.disabled =
                    false;

                buyButton.textContent =
                    "Buy Now";

                return;

            }


            walletBalance.textContent =
                money(
                    result.balance
                );

            buyButton.disabled =
                true;

            buyButton.textContent =
                "Purchase Complete";


            let deliveryMessage =
                "Your purchase was completed successfully.";

            if(
                result.deliveryDetails
            ){

                deliveryMessage +=
                    "\n\nDelivery:\n" +
                    result.deliveryDetails;

            }


            showMessage(
                "Purchase Successful",
                deliveryMessage,
                true,
                "View My Orders",
                () => {

                    window.location.href =
                        "orders.html";

                }
            );

        }
        catch(error){

            console.error(
                "Purchase error:",
                error
            );

            showMessage(
                "Purchase Failed",
                "Unable to connect to the purchase server. Please try again.",
                false,
                "Continue"
            );

            buyButton.disabled =
                false;

            buyButton.textContent =
                "Buy Now";

        }

    }
);


onAuthStateChanged(
    auth,
    async (user) => {

        if(
            !user
        ){

            window.location.href =
                "login.html";

            return;

        }

        currentUser =
            user;

        await loadProduct();

    }
);


messageModal.addEventListener(
    "click",
    (event) => {

        if(
            event.target ===
            messageModal
        ){

            messageModal.classList.remove(
                "show"
            );

        }

    }
);

</script>

</body>
</html>
