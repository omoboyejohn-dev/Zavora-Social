<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zavora Social | Login</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:#080b16;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#101528;
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:30px;
    box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:900;
    margin-bottom:8px;
    background:linear-gradient(90deg,#8b5cf6,#22d3ee);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    text-align:center;
    color:#9ca3af;
    margin-bottom:28px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#dbe4f0;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border-radius:11px;
    border:1px solid rgba(255,255,255,.1);
    outline:none;
    background:#080b16;
    color:#fff;
    font-size:15px;
}

input:focus{
    border-color:#8b5cf6;
}

.remember{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:20px;
    color:#9ca3af;
    font-size:14px;
}

.remember input{
    width:auto;
    margin:0;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:linear-gradient(90deg,#7c3aed,#06b6d4);
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.forgot{
    text-align:right;
    margin-top:15px;
}

.forgot a{
    color:#22d3ee;
    text-decoration:none;
    font-size:14px;
}

.register{
    text-align:center;
    margin-top:25px;
    color:#9ca3af;
}

.register a{
    color:#a78bfa;
    text-decoration:none;
    font-weight:700;
}

.message{
    margin-top:18px;
    padding:12px;
    border-radius:10px;
    display:none;
    text-align:center;
    font-size:14px;
}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        ZAVORA SOCIAL
    </div>

    <div class="subtitle">
        Login to your account
    </div>

    <form id="loginForm">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <label class="remember">

            <input
                type="checkbox"
                id="remember"
                checked
            >

            Remember me

        </label>

        <button
            type="submit"
            id="loginBtn"
        >
            Login
        </button>

    </form>


    <div class="forgot">

        <a href="#" id="forgotPassword">
            Forgot password?
        </a>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <div class="register">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    setPersistence,
    browserLocalPersistence,
    browserSessionPersistence,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBzj9_RgQPW21duk4sxyLUO3hy3-6GwGs",

    authDomain:
        "zavorasocial.firebaseapp.com",

    databaseURL:
        "https://zavorasocial-default-rtdb.firebaseio.com/",

    projectId:
        "zavorasocial",

    storageBucket:
        "zavorasocial.firebasestorage.app",

    messagingSenderId:
        "447170165246",

    appId:
        "1:447170165246:web:982649e6533257ea0f28af",

    measurementId:
        "G-D4LNBEWH50"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


/* =========================
   ELEMENTS
========================= */

const loginForm =
    document.getElementById("loginForm");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");

const forgotPassword =
    document.getElementById("forgotPassword");

const remember =
    document.getElementById("remember");


/* =========================
   MESSAGE
========================= */

function showMessage(text){

    message.textContent = text;

    message.style.display = "block";

}


/* =========================
   GET REDIRECT
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const redirect =
    params.get("redirect");


/*
   Only allow pages inside Zavora Social.

   This prevents an external website from
   being used as a redirect.
*/

function getSafeRedirect(){

    if(!redirect){
        return "dashboard.html";
    }


    try{

        const decoded =
            decodeURIComponent(redirect);


        if(
            /^(dashboard|products|product|wallet|orders|transactions|profile|notifications|support)\.html(?:\?.*)?$/.test(decoded)
        ){

            return decoded;

        }

    }catch(error){

        console.error(error);

    }


    return "dashboard.html";

}


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        loginBtn.disabled = true;

        loginBtn.textContent =
            "Logging in...";


        try{

            /*
               Keep the Firebase login session
               on this browser.
            */

            await setPersistence(
                auth,
                remember.checked
                    ? browserLocalPersistence
                    : browserSessionPersistence
            );


            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            /*
               IMPORTANT:
               Return to the page the customer
               originally wanted.
            */

            const destination =
                getSafeRedirect();


            window.location.replace(
                destination
            );


        }catch(error){

            console.error(
                "Login error:",
                error
            );


            let text =
                "Login failed. Please check your email and password.";


            if(
                error.code ===
                "auth/invalid-credential"
            ){

                text =
                    "Incorrect email or password.";

            }

            else if(
                error.code ===
                "auth/user-not-found"
            ){

                text =
                    "No account was found with this email.";

            }

            else if(
                error.code ===
                "auth/wrong-password"
            ){

                text =
                    "Incorrect password.";

            }

            else if(
                error.code ===
                "auth/invalid-email"
            ){

                text =
                    "Please enter a valid email address.";

            }


            showMessage(text);


            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "Login";

        }

    }
);


/* =========================
   FORGOT PASSWORD
========================= */

forgotPassword.addEventListener(
    "click",
    async (event) => {

        event.preventDefault();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        if(!email){

            showMessage(
                "Enter your email address first."
            );

            return;
        }


        try{

            await sendPasswordResetEmail(
                auth,
                email
            );


            showMessage(
                "Password reset email sent. Check your inbox."
            );


        }catch(error){

            console.error(error);

            showMessage(
                "Unable to send password reset email."
            );

        }

    }
);

</script>

</body>
</html>
