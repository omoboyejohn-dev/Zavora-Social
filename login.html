<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zavora Social | Login</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:#080b16;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#101528;
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:30px;
    box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:900;
    margin-bottom:8px;
    background:linear-gradient(90deg,#8b5cf6,#22d3ee);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    text-align:center;
    color:#9ca3af;
    margin-bottom:28px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#dbe4f0;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border-radius:11px;
    border:1px solid rgba(255,255,255,.1);
    outline:none;
    background:#080b16;
    color:#fff;
    font-size:15px;
}

input:focus{
    border-color:#8b5cf6;
}

.remember{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:20px;
    color:#9ca3af;
    font-size:14px;
}

.remember input{
    width:auto;
    margin:0;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:linear-gradient(90deg,#7c3aed,#06b6d4);
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.forgot{
    text-align:right;
    margin-top:15px;
}

.forgot a{
    color:#22d3ee;
    text-decoration:none;
    font-size:14px;
}

.register{
    text-align:center;
    margin-top:25px;
    color:#9ca3af;
}

.register a{
    color:#a78bfa;
    text-decoration:none;
    font-weight:700;
}

.message{
    margin-top:18px;
    padding:12px;
    border-radius:10px;
    display:none;
    text-align:center;
    font-size:14px;
    line-height:1.5;
    word-break:break-word;
}

.message.error{
    display:block;
    background:rgba(239,68,68,.12);
    border:1px solid rgba(239,68,68,.3);
    color:#fca5a5;
}

.message.success{
    display:block;
    background:rgba(34,197,94,.12);
    border:1px solid rgba(34,197,94,.3);
    color:#86efac;
}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        ZAVORA SOCIAL
    </div>

    <div class="subtitle">
        Login to your account
    </div>

    <form id="loginForm">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <label class="remember">

            <input
                type="checkbox"
                id="remember"
                checked
            >

            Remember me

        </label>

        <button
            type="submit"
            id="loginBtn"
        >
            Login
        </button>

    </form>

    <div class="forgot">

        <a href="#" id="forgotPassword">
            Forgot password?
        </a>

    </div>

    <div
        id="message"
        class="message"
    ></div>

    <div class="register">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    setPersistence,
    browserLocalPersistence,
    browserSessionPersistence,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBzj9_RgQPW21duk4sxyLUO3hy3-6GwGs",

    authDomain:
        "zavorasocial.firebaseapp.com",

    databaseURL:
        "https://zavorasocial-default-rtdb.firebaseio.com/",

    projectId:
        "zavorasocial",

    storageBucket:
        "zavorasocial.firebasestorage.app",

    messagingSenderId:
        "447170165246",

    appId:
        "1:447170165246:web:982649e6533257ea0f28af",

    measurementId:
        "G-D4LNBEWH50"
};


/* =========================
   INITIALIZE FIREBASE
========================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


/* =========================
   ELEMENTS
========================= */

const loginForm =
    document.getElementById("loginForm");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");

const forgotPassword =
    document.getElementById("forgotPassword");

const remember =
    document.getElementById("remember");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");


/* =========================
   MESSAGE
========================= */

function showError(text){

    message.className =
        "message error";

    message.textContent =
        text;

}

function showSuccess(text){

    message.className =
        "message success";

    message.textContent =
        text;

}


/* =========================
   REDIRECT
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const redirect =
    params.get("redirect");


function getSafeRedirect(){

    if(!redirect){

        return "dashboard.html";

    }


    try{

        const decoded =
            decodeURIComponent(redirect);


        if(
            /^(dashboard|products|product|wallet|orders|transactions|profile|notifications|support)\.html(?:\?.*)?$/
            .test(decoded)
        ){

            return decoded;

        }

    }catch(error){

        console.error(
            "Redirect error:",
            error
        );

    }


    return "dashboard.html";

}


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if(!email){

            showError(
                "Please enter your email address."
            );

            return;

        }


        if(!password){

            showError(
                "Please enter your password."
            );

            return;

        }


        loginBtn.disabled =
            true;

        loginBtn.textContent =
            "Logging in...";


        message.style.display =
            "none";


        try{

            /* =========================
               SET LOGIN PERSISTENCE
            ========================= */

            await setPersistence(
                auth,
                remember.checked
                    ? browserLocalPersistence
                    : browserSessionPersistence
            );


            /* =========================
               FIREBASE LOGIN
            ========================= */

            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            console.log(
                "LOGIN SUCCESS:",
                credential.user.uid
            );


            showSuccess(
                "Login successful. Opening your dashboard..."
            );


            /* =========================
               REDIRECT
            ========================= */

            const destination =
                getSafeRedirect();


            setTimeout(() => {

                window.location.replace(
                    destination
                );

            }, 500);


        }catch(error){

            console.error(
                "FIREBASE LOGIN ERROR:",
                error
            );


            let text =
                "Login failed.";


            switch(error.code){

                case "auth/invalid-credential":

                    text =
                        "Incorrect email or password.";

                    break;


                case "auth/user-not-found":

                    text =
                        "No account exists with this email.";

                    break;


                case "auth/wrong-password":

                    text =
                        "The password is incorrect.";

                    break;


                case "auth/invalid-email":

                    text =
                        "The email address is not valid.";

                    break;


                case "auth/user-disabled":

                    text =
                        "This account has been disabled.";

                    break;


                case "auth/too-many-requests":

                    text =
                        "Too many login attempts. Please wait and try again.";

                    break;


                case "auth/network-request-failed":

                    text =
                        "Network error. Check your internet connection.";

                    break;


                case "auth/operation-not-allowed":

                    text =
                        "Email/password login is not enabled in Firebase Authentication.";

                    break;


                default:

                    text =
                        "Firebase error: " +
                        (error.code || "unknown-error") +
                        " — " +
                        (error.message || "Unknown error.");

                    break;

            }


            showError(text);


            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "Login";

        }

    }
);


/* =========================
   FORGOT PASSWORD
========================= */

forgotPassword.addEventListener(
    "click",
    async (event) => {

        event.preventDefault();


        const email =
            emailInput.value.trim();


        if(!email){

            showError(
                "Enter your email address first."
            );

            emailInput.focus();

            return;

        }


        try{

            await sendPasswordResetEmail(
                auth,
                email
            );


            showSuccess(
                "Password reset email sent. Check your inbox."
            );


        }catch(error){

            console.error(
                "PASSWORD RESET ERROR:",
                error
            );


            let text =
                "Unable to send password reset email.";


            if(
                error.code ===
                "auth/user-not-found"
            ){

                text =
                    "No account exists with this email.";

            }

            else if(
                error.code ===
                "auth/invalid-email"
            ){

                text =
                    "Please enter a valid email address.";

            }

            else{

                text =
                    "Firebase error: " +
                    (error.code || "unknown-error");

            }


            showError(text);

        }

    }
);

</script>

</body>
</html>
