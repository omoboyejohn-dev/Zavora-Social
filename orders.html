<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zavora Social | My Orders</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;

    background:#ffffff;

    color:#111827;

    min-height:100vh;
}

header{
    position:sticky;
    top:0;
    z-index:100;

    background:#ffffff;

    border-bottom:1px solid #e5e7eb;
}

.navbar{
    max-width:1100px;

    min-height:70px;

    margin:auto;

    padding:0 20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;
}

.logo{
    color:#111827;

    text-decoration:none;

    font-size:22px;

    font-weight:900;
}

.logo span{
    color:#7e22ce;
}

.back{
    color:#ffffff;

    background:linear-gradient(
        135deg,
        #7e22ce,
        #2563eb
    );

    border:none;

    padding:9px 13px;

    border-radius:9px;

    text-decoration:none;

    font-size:12px;

    font-weight:800;

    transition:.2s;
}

.back:hover{
    transform:translateY(-1px);

    box-shadow:0 6px 18px rgba(37,99,235,.18);
}

.container{
    max-width:1000px;

    margin:auto;

    padding:32px 20px 60px;
}

.heading{
    margin-bottom:25px;
}

.heading h1{
    color:#111827;

    font-size:32px;

    font-weight:900;

    margin-bottom:7px;
}

.heading p{
    color:#64748b;

    font-size:13px;

    line-height:1.6;
}

.order-card{
    background:#ffffff;

    border:1px solid #e5e7eb;

    border-radius:18px;

    padding:20px;

    margin-bottom:18px;

    box-shadow:0 7px 22px rgba(15,23,42,.05);

    transition:.2s;
}

.order-card:hover{
    border-color:#c4b5fd;

    box-shadow:0 10px 28px rgba(37,99,235,.08);
}

.order-top{
    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:15px;

    margin-bottom:18px;
}

.order-name{
    color:#111827;

    font-weight:850;

    font-size:18px;
}

.order-id{
    color:#94a3b8;

    font-size:12px;

    margin-top:5px;

    word-break:break-all;
}

.status{
    height:max-content;

    padding:7px 11px;

    border-radius:9px;

    font-size:11px;

    font-weight:900;

    background:linear-gradient(
        135deg,
        #7e22ce,
        #2563eb
    );

    color:#ffffff;

    white-space:nowrap;
}

.order-info{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:12px;
}

.info{
    padding:13px;

    border-radius:11px;

    background:#faf5ff;

    border:1px solid #ede9fe;

    min-width:0;
}

.info small{
    display:block;

    color:#64748b;

    margin-bottom:6px;

    font-size:11px;
}

.info strong{
    color:#111827;

    font-size:14px;

    line-height:1.5;

    word-break:break-word;
}

.delivery-box{
    margin-top:18px;

    padding:18px;

    border-radius:14px;

    background:#faf5ff;

    border:1px solid #ddd6fe;
}

.delivery-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:12px;

    margin-bottom:14px;
}

.delivery-title{
    color:#6d28d9;

    font-size:15px;

    font-weight:900;
}

.delivery-status{
    display:inline-block;

    padding:6px 10px;

    border-radius:8px;

    font-size:10px;

    font-weight:900;

    background:linear-gradient(
        135deg,
        #7e22ce,
        #2563eb
    );

    color:#ffffff;

    white-space:nowrap;
}

.delivery-meta{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:10px;

    margin-bottom:15px;
}

.delivery-meta-item{
    padding:11px;

    background:#ffffff;

    border:1px solid #ede9fe;

    border-radius:10px;
}

.delivery-meta-item small{
    display:block;

    color:#64748b;

    font-size:11px;

    margin-bottom:4px;
}

.delivery-meta-item strong{
    color:#111827;

    font-size:13px;
}

.details-label{
    color:#6d28d9;

    font-size:11px;

    font-weight:900;

    margin-bottom:8px;
}

.delivery-details{
    color:#334155;

    font-size:14px;

    line-height:1.7;

    white-space:pre-wrap;

    word-break:break-word;

    background:#ffffff;

    border:1px solid #ede9fe;

    border-radius:11px;

    padding:14px;

    font-family:Inter,Arial,sans-serif;
}

.no-details{
    color:#64748b;

    font-size:13px;

    line-height:1.6;

    background:#ffffff;

    border:1px solid #ede9fe;

    border-radius:11px;

    padding:14px;
}

.empty{
    padding:65px 20px;

    text-align:center;

    border:1px dashed #d1d5db;

    border-radius:20px;

    background:#fafafa;
}

.empty-icon{
    font-size:48px;

    margin-bottom:12px;
}

.empty h2{
    color:#111827;

    margin-bottom:8px;
}

.empty p{
    color:#64748b;

    line-height:1.6;
}

.shop-btn{
    display:inline-block;

    margin-top:20px;

    text-decoration:none;

    color:#ffffff;

    padding:12px 18px;

    border-radius:11px;

    font-weight:900;

    background:linear-gradient(
        135deg,
        #7e22ce,
        #2563eb
    );

    transition:.2s;
}

.shop-btn:hover{
    transform:translateY(-1px);

    box-shadow:0 7px 18px rgba(37,99,235,.20);
}

.loading{
    text-align:center;

    padding:55px 20px;

    color:#64748b;

    background:#faf5ff;

    border:1px solid #ede9fe;

    border-radius:17px;
}

.error{
    text-align:center;

    padding:35px 20px;

    border-radius:18px;

    background:#fef2f2;

    border:1px solid #fecaca;

    color:#dc2626;

    line-height:1.6;
}

footer{
    text-align:center;

    color:#94a3b8;

    font-size:12px;

    padding:0 20px 30px;
}

@media(max-width:700px){

    .navbar{
        min-height:64px;

        padding:0 12px;
    }

    .logo{
        font-size:19px;
    }

    .back{
        padding:8px 10px;

        font-size:10px;
    }

    .container{
        padding:25px 12px 50px;
    }

    .heading h1{
        font-size:27px;
    }

    .order-top{
        flex-direction:column;
    }

    .order-info{
        grid-template-columns:1fr;
    }

    .delivery-meta{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header>

<div class="navbar">

<a href="dashboard.html" class="logo">
    Zavora <span>Social</span>
</a>

<a href="dashboard.html" class="back">
    ← Dashboard
</a>

</div>

</header>

<main class="container">

<div class="heading">

<h1>
    My Orders
</h1>

<p>
    View your purchases, delivery status,
    dates, times and delivered item details.
</p>

</div>

<div id="ordersArea">

<div class="loading">
    Loading your orders...
</div>

</div>

</main>

<footer>

©️ <span id="year"></span>
Zavora Social. All rights reserved.

</footer>

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    query,
    orderByChild,
    equalTo,
    onValue
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyBzjZ9_rGqPW21duk4sxyLUO3hy3-6GwGs",

    authDomain:
        "zavorasocial.firebaseapp.com",

    databaseURL:
        "https://zavorasocial-default-rtdb.firebaseio.com",

    projectId:
        "zavorasocial",

    storageBucket:
        "zavorasocial.firebasestorage.app",

    messagingSenderId:
        "447170165246",

    appId:
        "1:447170165246:web:982649e6533257ea0f28af",

    measurementId:
        "G-D4LNBEWH50"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getDatabase(app);


const ordersArea =
    document.getElementById(
        "ordersArea"
    );


document.getElementById(
    "year"
).textContent =
    new Date().getFullYear();


function formatPrice(amount){

    const number =
        Number(amount || 0);

    return "₦" +
        number.toLocaleString(
            "en-NG",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


function formatDateTime(timestamp){

    if(
        timestamp === null ||
        timestamp === undefined ||
        timestamp === ""
    ){

        return "Date unavailable";

    }

    const date =
        new Date(
            Number(timestamp)
        );

    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "Date unavailable";

    }

    return date.toLocaleString(
        "en-NG",
        {
            dateStyle:"medium",
            timeStyle:"short"
        }
    );

}


function formatDate(timestamp){

    if(
        timestamp === null ||
        timestamp === undefined ||
        timestamp === ""
    ){

        return "Date unavailable";

    }

    const date =
        new Date(
            Number(timestamp)
        );

    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "Date unavailable";

    }

    return date.toLocaleDateString(
        "en-NG",
        {
            dateStyle:"medium"
        }
    );

}


function formatTime(timestamp){

    if(
        timestamp === null ||
        timestamp === undefined ||
        timestamp === ""
    ){

        return "Time unavailable";

    }

    const date =
        new Date(
            Number(timestamp)
        );

    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "Time unavailable";

    }

    return date.toLocaleTimeString(
        "en-NG",
        {
            hour:"numeric",
            minute:"2-digit",
            second:"2-digit"
        }
    );

}


function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function getDeliveryDetails(order){

    const details =
        order.deliveryDetails ??
        order.delivery ??
        order.details ??
        order.itemDetails ??
        order.accountDetails ??
        order.item ??
        "";

    if(
        details === null ||
        details === undefined ||
        details === ""
    ){

        return "";

    }

    if(
        typeof details === "object"
    ){

        try{

            return JSON.stringify(
                details,
                null,
                2
            );

        }
        catch(error){

            console.error(
                "Unable to format delivery details:",
                error
            );

            return String(details);

        }

    }

    return String(details);

}


function getDeliveryTimestamp(order){

    return (
        order.deliveredAt ||
        order.deliveryAt ||
        order.completedAt ||
        order.createdAt ||
        null
    );

}


function renderOrders(orders){

    if(
        orders.length === 0
    ){

        ordersArea.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📦
                </div>

                <h2>
                    No orders yet
                </h2>

                <p>
                    Your purchases will appear here
                    after you place an order.
                </p>

                <a
                    href="products.html"
                    class="shop-btn"
                >
                    Browse Products
                </a>

            </div>

        `;

        return;

    }


    ordersArea.innerHTML = "";


    orders.forEach(
        (order) => {

            const deliveryDetails =
                getDeliveryDetails(
                    order
                );

            const deliveryStatus =
                String(
                    order.deliveryStatus ||
                    "pending"
                );

            const orderStatus =
                String(
                    order.status ||
                    "completed"
                );

            const deliveryTimestamp =
                getDeliveryTimestamp(
                    order
                );

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "order-card";


            let deliveryHTML = "";


            if(
                deliveryDetails
            ){

                deliveryHTML = `

                    <div class="delivery-box">

                        <div class="delivery-header">

                            <div class="delivery-title">
                                📦 Delivered Item
                            </div>

                            <div class="delivery-status">
                                ${escapeHTML(
                                    deliveryStatus.toUpperCase()
                                )}
                            </div>

                        </div>

                        <div class="delivery-meta">

                            <div class="delivery-meta-item">

                                <small>
                                    Delivery Date
                                </small>

                                <strong>
                                    ${formatDate(
                                        deliveryTimestamp
                                    )}
                                </strong>

                            </div>

                            <div class="delivery-meta-item">

                                <small>
                                    Delivery Time
                                </small>

                                <strong>
                                    ${formatTime(
                                        deliveryTimestamp
                                    )}
                                </strong>

                            </div>

                        </div>

                        <div class="details-label">
                            YOUR DELIVERED ITEM / ACCOUNT DETAILS
                        </div>

                        <div class="delivery-details">
                            ${escapeHTML(
                                deliveryDetails
                            )}
                        </div>

                    </div>

                `;

            }
            else{

                deliveryHTML = `

                    <div class="delivery-box">

                        <div class="delivery-header">

                            <div class="delivery-title">
                                📦 Delivery
                            </div>

                            <div class="delivery-status">
                                ${escapeHTML(
                                    deliveryStatus.toUpperCase()
                                )}
                            </div>

                        </div>

                        <div class="delivery-meta">

                            <div class="delivery-meta-item">

                                <small>
                                    Delivery Date
                                </small>

                                <strong>
                                    ${formatDate(
                                        deliveryTimestamp
                                    )}
                                </strong>

                            </div>

                            <div class="delivery-meta-item">

                                <small>
                                    Delivery Time
                                </small>

                                <strong>
                                    ${formatTime(
                                        deliveryTimestamp
                                    )}
                                </strong>

                            </div>

                        </div>

                        <div class="no-details">

                            Your order has been completed,
                            but no delivery details were found
                            for this order.

                        </div>

                    </div>

                `;

            }


            card.innerHTML = `

                <div class="order-top">

                    <div>

                        <div class="order-name">
                            ${escapeHTML(
                                order.productName ||
                                "Product"
                            )}
                        </div>

                        <div class="order-id">
                            Order ID:
                            ${escapeHTML(
                                order.id
                            )}
                        </div>

                    </div>

                    <div class="status">
                        ${escapeHTML(
                            orderStatus.toUpperCase()
                        )}
                    </div>

                </div>

                <div class="order-info">

                    <div class="info">

                        <small>
                            Product
                        </small>

                        <strong>
                            ${escapeHTML(
                                order.productName ||
                                "Product"
                            )}
                        </strong>

                    </div>

                    <div class="info">

                        <small>
                            Amount Paid
                        </small>

                        <strong>
                            ${formatPrice(
                                order.price
                            )}
                        </strong>

                    </div>

                    <div class="info">

                        <small>
                            Category
                        </small>

                        <strong>
                            ${escapeHTML(
                                order.category ||
                                "—"
                            )}
                        </strong>

                    </div>

                    <div class="info">

                        <small>
                            Order Date
                        </small>

                        <strong>
                            ${formatDate(
                                order.createdAt
                            )}
                        </strong>

                    </div>

                    <div class="info">

                        <small>
                            Order Time
                        </small>

                        <strong>
                            ${formatTime(
                                order.createdAt
                            )}
                        </strong>

                    </div>

                    <div class="info">

                        <small>
                            Order Status
                        </small>

                        <strong>
                            ${escapeHTML(
                                orderStatus.toUpperCase()
                            )}
                        </strong>

                    </div>

                </div>

                ${deliveryHTML}

            `;

            ordersArea.appendChild(
                card
            );

        }
    );

}


onAuthStateChanged(
    auth,
    (user) => {

        if(
            !user
        ){

            window.location.replace(
                "login.html"
            );

            return;

        }


        const ordersRef =
            query(
                ref(db,"orders"),
                orderByChild("uid"),
                equalTo(user.uid)
            );


        onValue(

            ordersRef,

            (snapshot) => {

                const data =
                    snapshot.val() || {};

                const orders =
                    Object.entries(data)

                        .map(
                            ([id,order]) => ({

                                id:id,

                                ...order

                            })
                        );


                orders.sort(
                    (a,b) =>
                        Number(
                            b.createdAt || 0
                        )
                        -
                        Number(
                            a.createdAt || 0
                        )
                );


                renderOrders(
                    orders
                );

            },

            (error) => {

                console.error(
                    "Orders loading error:",
                    error
                );

                ordersArea.innerHTML = `

                    <div class="error">

                        Unable to load your orders.
                        Please try again later.

                    </div>

                `;

            }

        );

    }
);

</script>

</body>
</html>
