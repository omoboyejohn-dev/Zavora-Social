<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zavora Social | Marketplace</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Inter,Arial,sans-serif;
    color:#fff;
    min-height:100vh;
    background:
    radial-gradient(circle at top left,rgba(124,58,237,.18),transparent 35%),
    radial-gradient(circle at top right,rgba(6,182,212,.12),transparent 30%),
    #080b16;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(8,11,22,.88);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.navbar{
    max-width:1200px;
    min-height:72px;
    margin:auto;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    color:#fff;
    text-decoration:none;
    font-size:22px;
    font-weight:900;
}

.logo span{
    background:linear-gradient(90deg,#a78bfa,#22d3ee);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.back{
    color:#cbd5e1;
    text-decoration:none;
    font-size:14px;
    font-weight:700;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:35px 20px 60px;
}

.heading{
    margin-bottom:25px;
}

.heading h1{
    font-size:32px;
    margin-bottom:7px;
}

.heading p{
    color:#94a3b8;
}

.category-bar{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:12px;
    margin-bottom:25px;
}

.category-btn{
    white-space:nowrap;
    border:1px solid rgba(255,255,255,.09);
    background:rgba(255,255,255,.045);
    color:#cbd5e1;
    border-radius:12px;
    padding:11px 17px;
    cursor:pointer;
    font-weight:700;
}

.category-btn:hover,
.category-btn.active{
    color:#fff;
    border-color:#8b5cf6;
    background:rgba(124,58,237,.18);
}

.products-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:17px;
}

.product-card{
    overflow:hidden;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.045);
}

.product-image{
    width:100%;
    height:190px;
    object-fit:cover;
    background:#111827;
}

.product-body{
    padding:17px;
}

.product-category{
    color:#22d3ee;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    margin-bottom:8px;
}

.product-name{
    font-size:16px;
    font-weight:800;
    line-height:1.4;
    margin-bottom:10px;
}

.product-description{
    color:#94a3b8;
    font-size:13px;
    line-height:1.5;
    margin-bottom:15px;
}

.product-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.price{
    font-size:18px;
    font-weight:900;
}

.buy-btn{
    border:0;
    color:#fff;
    cursor:pointer;
    padding:10px 14px;
    border-radius:10px;
    font-weight:800;
    background:linear-gradient(135deg,#7c3aed,#06b6d4);
}

.buy-btn:hover{
    opacity:.9;
}

.empty{
    padding:60px 20px;
    text-align:center;
    border:1px dashed rgba(255,255,255,.13);
    border-radius:20px;
    background:rgba(255,255,255,.025);
}

.empty-icon{
    font-size:45px;
    margin-bottom:12px;
}

.empty h2{
    margin-bottom:8px;
}

.empty p{
    color:#94a3b8;
    max-width:500px;
    margin:auto;
    line-height:1.6;
}

footer{
    text-align:center;
    color:#64748b;
    font-size:13px;
    padding:0 20px 30px;
}

@media(max-width:1000px){
    .products-grid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:700px){
    .products-grid{grid-template-columns:repeat(2,1fr)}
    .container{padding:28px 15px 50px}
    .heading h1{font-size:27px}
}

@media(max-width:450px){
    .products-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
    <div class="navbar">
        <a href="dashboard.html" class="logo">
            Zavora <span>Social</span>
        </a>

        <a href="dashboard.html" class="back">
            ← Dashboard
        </a>
    </div>
</header>

<main class="container">

    <div class="heading">
        <h1>Marketplace</h1>
        <p>Browse available products and services.</p>
    </div>

    <div class="category-bar" id="categoryBar">
        <button class="category-btn active">All Products</button>
    </div>

    <div id="productsArea">

        <div class="empty">
            <div class="empty-icon">🛍️</div>

            <h2>Marketplace is ready</h2>

            <p>
                Products added by the Zavora Social administration
                will appear here.
            </p>
        </div>

    </div>

</main>

<footer>
    © <span id="year"></span> Zavora Social. All rights reserved.
</footer>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


const firebaseConfig = {
    apiKey:"AIzaSyBzjZ9_rGqPW21duk4sxyLUO3hy3-6GwGs",
    authDomain:"zavorasocial.firebaseapp.com",
    projectId:"zavorasocial",
    storageBucket:"zavorasocial.firebasestorage.app",
    messagingSenderId:"447170165246",
    appId:"1:447170165246:web:982649e6533257ea0f28af",
    measurementId:"G-D4LNBEWH50"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth,(user)=>{

    if(!user){
        window.location.href="login.html";
        return;
    }

});

document.getElementById("year").textContent =
    new Date().getFullYear();

</script>

</body>
</html>
