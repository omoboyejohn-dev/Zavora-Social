<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Zavora Social | Products</title><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:
        radial-gradient(circle at top left,rgba(124,58,237,.16),transparent 35%),
        radial-gradient(circle at top right,rgba(6,182,212,.10),transparent 30%),
        #080b16;
    color:#fff;
    min-height:100vh;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(8,11,22,.88);
    backdrop-filter:blur(18px);
}

.navbar{
    max-width:1250px;
    min-height:70px;
    margin:auto;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    color:#fff;
    text-decoration:none;
    font-size:22px;
    font-weight:900;
}

.logo span{
    background:linear-gradient(90deg,#a78bfa,#22d3ee);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.nav-right{
    display:flex;
    gap:10px;
}

.nav-btn{
    text-decoration:none;
    color:#cbd5e1;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    padding:10px 14px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
}

.container{
    max-width:1250px;
    margin:auto;
    padding:30px 20px 60px;
}

.page-title{
    margin-bottom:25px;
}

.page-title h1{
    font-size:32px;
    margin-bottom:7px;
}

.page-title p{
    color:#94a3b8;
}

.filter-area{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.filter-btn{
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.045);
    color:#cbd5e1;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-size:13px;
    font-weight:700;
}

.filter-btn.active{
    color:#fff;
    border-color:#8b5cf6;
    background:linear-gradient(
        135deg,
        rgba(124,58,237,.35),
        rgba(6,182,212,.18)
    );
}

.products-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.product-card{
    overflow:hidden;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    transition:.2s;
}

.product-card:hover{
    transform:translateY(-4px);
    border-color:rgba(139,92,246,.5);
}

.product-image{
    width:100%;
    height:210px;
    background:#111827;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.product-info{
    padding:17px;
}

.product-category{
    color:#67e8f9;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    margin-bottom:8px;
}

.product-name{
    font-size:17px;
    font-weight:850;
    margin-bottom:8px;
}

.product-price{
    font-size:20px;
    font-weight:900;
    color:#67e8f9;
    margin-bottom:10px;
}


/* ==============================
   STOCK STATUS
============================== */

.stock-status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 9px;
    border-radius:8px;
    font-size:11px;
    font-weight:800;
    margin-bottom:12px;
}

.stock-status.in-stock{
    color:#86efac;
    background:rgba(34,197,94,.10);
    border:1px solid rgba(34,197,94,.20);
}

.stock-status.low-stock{
    color:#fde68a;
    background:rgba(234,179,8,.10);
    border:1px solid rgba(234,179,8,.20);
}

.stock-status.out-stock{
    color:#fca5a5;
    background:rgba(239,68,68,.10);
    border:1px solid rgba(239,68,68,.20);
}

.stock-status.unlimited{
    color:#67e8f9;
    background:rgba(6,182,212,.10);
    border:1px solid rgba(6,182,212,.20);
}


.product-description{
    color:#94a3b8;
    font-size:13px;
    line-height:1.5;
    min-height:40px;
    margin-bottom:16px;
}

.buy-btn{
    width:100%;
    border:none;
    color:#fff;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:800;
    background:linear-gradient(135deg,#7c3aed,#06b6d4);
}

.buy-btn.disabled{
    background:#374151;
    color:#9ca3af;
    cursor:not-allowed;
    opacity:.8;
}

.loading,
.empty,
.error{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    border-radius:18px;
}

.loading{
    color:#94a3b8;
}

.empty{
    border:1px dashed rgba(255,255,255,.12);
    color:#94a3b8;
}

.empty h2,
.error h2{
    color:#fff;
    margin-bottom:8px;
}

.error{
    background:rgba(239,68,68,.06);
    border:1px solid rgba(239,68,68,.2);
    color:#fca5a5;
}

@media(max-width:1000px){

    .products-grid{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:700px){

    .products-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:480px){

    .products-grid{
        grid-template-columns:1fr;
    }

    .container{
        padding:25px 14px 50px;
    }

    .page-title h1{
        font-size:27px;
    }

}

</style></head><body><header><div class="navbar"><a href="dashboard.html" class="logo">
    Zavora <span>Social</span>
</a>

<div class="nav-right">

    <a href="dashboard.html" class="nav-btn">
        Dashboard
    </a>

    <a href="orders.html" class="nav-btn">
        Orders
    </a>

</div>

</div></header><main class="container"><div class="page-title"><h1>Products</h1>

<p>
    Browse available products on Zavora Social.
</p>

</div><div class="filter-area" id="filterArea"><button
    class="filter-btn active"
    data-category="all"
>
    All Products
</button>

</div><div
    class="products-grid"
    id="productsGrid"
><div class="loading">
    Checking your account...
</div>

</div></main><script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* ==============================
   FIREBASE
============================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBzjZ9_rGqPW21duk4sxyLUO3hy3-6GwGs",

    authDomain:
        "zavorasocial.firebaseapp.com",

    databaseURL:
        "https://zavorasocial-default-rtdb.firebaseio.com/",

    projectId:
        "zavorasocial",

    storageBucket:
        "zavorasocial.firebasestorage.app",

    messagingSenderId:
        "447170165246",

    appId:
        "1:447170165246:web:982649e6533257ea0f28af",

    measurementId:
        "G-D4LNBEWH50"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getDatabase(app);


const productsGrid =
    document.getElementById("productsGrid");

const filterArea =
    document.getElementById("filterArea");


let allProducts = [];

let selectedCategory = "all";

let authResolved = false;


/* ==============================
   GET CATEGORY FROM URL
============================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const requestedCategory =
    urlParams.get("category");


if(requestedCategory){

    selectedCategory =
        decodeURIComponent(
            requestedCategory
        );

}


/* ==============================
   AUTH
============================== */

onAuthStateChanged(
    auth,
    (user) => {

        authResolved = true;


        if(!user){

            window.location.replace(
                "login.html"
            );

            return;

        }


        loadProducts();

        loadCategories();

    }
);


/* ==============================
   LOAD PRODUCTS
============================== */

function loadProducts(){

    const productsRef =
        ref(
            db,
            "products"
        );


    onValue(

        productsRef,

        (snapshot) => {

            const data =
                snapshot.val() || {};


            allProducts =
                Object.entries(data)

                .map(
                    ([id, product]) => ({

                        id:id,

                        ...product

                    })
                )

                .filter(
                    product =>
                        product &&
                        product.active === true
                );


            allProducts.sort(
                (a,b) => {

                    const aTime =
                        Number(
                            a.createdAt || 0
                        );

                    const bTime =
                        Number(
                            b.createdAt || 0
                        );

                    return bTime - aTime;

                }
            );


            renderProducts();

        },

        (error) => {

            console.error(
                "Product loading error:",
                error
            );


            productsGrid.innerHTML = `

                <div class="error">

                    <h2>
                        Products unavailable
                    </h2>

                    <p>
                        We could not load the marketplace products.
                    </p>

                </div>

            `;

        }

    );

}


/* ==============================
   LOAD CATEGORIES
============================== */

function loadCategories(){

    const categoriesRef =
        ref(
            db,
            "categories"
        );


    onValue(

        categoriesRef,

        (snapshot) => {

            const data =
                snapshot.val() || {};


            Object.entries(data)
            .forEach(
                ([id, category]) => {

                    if(
                        !category ||
                        category.active !== true ||
                        !category.name
                    ){

                        return;

                    }


                    const exists =
                        [
                            ...filterArea.children
                        ]
                        .some(
                            button => {

                                return String(
                                    button.dataset.category
                                )
                                .toLowerCase()
                                ===
                                String(
                                    category.name
                                )
                                .toLowerCase();

                            }
                        );


                    if(exists){

                        return;

                    }


                    const button =
                        document.createElement(
                            "button"
                        );


                    button.className =
                        "filter-btn";


                    button.dataset.category =
                        category.name;


                    button.textContent =
                        (
                            category.icon ||
                            "📦"
                        )
                        + " "
                        + category.name;


                    button.addEventListener(
                        "click",
                        () => {

                            selectedCategory =
                                category.name;

                            updateButtons();

                            renderProducts();

                        }
                    );


                    filterArea.appendChild(
                        button
                    );

                }
            );


            updateButtons();

            renderProducts();

        },

        (error) => {

            console.error(
                "Category loading error:",
                error
            );

        }

    );

}


/* ==============================
   STOCK STATUS
============================== */

function getStockInfo(product){

    /*
     * If stock does not exist,
     * the product is treated as unlimited.
     */

    if(
        product.stock === undefined ||
        product.stock === null ||
        product.stock === ""
    ){

        return {

            type:"unlimited",

            text:"✓ Unlimited"

        };

    }


    const stock =
        Number(product.stock);


    if(
        !Number.isFinite(stock)
    ){

        return {

            type:"unlimited",

            text:"✓ Unlimited"

        };

    }


    if(stock <= 0){

        return {

            type:"out-stock",

            text:"● Out of Stock"

        };

    }


    if(stock <= 5){

        return {

            type:"low-stock",

            text:
                "⚠ " +
                stock +
                (
                    stock === 1
                    ? " left"
                    : " left"
                )

        };

    }


    return {

        type:"in-stock",

        text:
            "✓ " +
            stock +
            " available"

    };

}


/* ==============================
   RENDER PRODUCTS
============================== */

function renderProducts(){

    if(!authResolved){

        return;

    }


    let products =
        allProducts;


    if(
        selectedCategory &&
        selectedCategory !== "all"
    ){

        products =
            allProducts.filter(
                product => {

                    return String(
                        product.category || ""
                    )
                    .toLowerCase()
                    ===
                    String(
                        selectedCategory
                    )
                    .toLowerCase();

                }
            );

    }


    if(products.length === 0){

        productsGrid.innerHTML = `

            <div class="empty">

                <div style="font-size:45px">
                    📦
                </div>

                <h2>
                    No products available
                </h2>

                <p>
                    ${
                        selectedCategory === "all"
                        ? "New products will appear here."
                        : "There are no products in this category yet."
                    }
                </p>

            </div>

        `;

        return;

    }


    productsGrid.innerHTML = "";


    products.forEach(
        product => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "product-card";


            const image =
                product.image ||
                "https://via.placeholder.com/600x500?text=Zavora";


            const description =
                product.description ||
                "Quality digital product available on Zavora Social.";


            const stockInfo =
                getStockInfo(product);


            const isOutOfStock =
                stockInfo.type === "out-stock";


            card.innerHTML = `

                <div class="product-image">

                    <img
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(
                            product.name ||
                            "Product"
                        )}"
                    >

                </div>


                <div class="product-info">

                    <div class="product-category">

                        📦
                        ${escapeHtml(
                            product.category ||
                            "Product"
                        )}

                    </div>


                    <div class="product-name">

                        ${escapeHtml(
                            product.name ||
                            "Unnamed Product"
                        )}

                    </div>


                    <div class="product-price">

                        ₦${formatNumber(
                            product.price || 0
                        )}

                    </div>


                    <div class="stock-status ${stockInfo.type}">

                        ${escapeHtml(
                            stockInfo.text
                        )}

                    </div>


                    <div class="product-description">

                        ${escapeHtml(
                            description
                        )}

                    </div>


                    <button
                        class="buy-btn ${
                            isOutOfStock
                            ? "disabled"
                            : ""
                        }"
                        ${
                            isOutOfStock
                            ? "disabled"
                            : ""
                        }
                    >

                        ${
                            isOutOfStock
                            ? "Out of Stock"
                            : "Buy Now"
                        }

                    </button>

                </div>

            `;


            const buyButton =
                card.querySelector(
                    ".buy-btn"
                );


            if(!isOutOfStock){

                buyButton.addEventListener(
                    "click",
                    () => {

                        window.location.href =
                            "product.html?id=" +
                            encodeURIComponent(
                                product.id
                            );

                    }
                );

            }


            const imageElement =
                card.querySelector("img");


            imageElement.addEventListener(
                "error",
                () => {

                    imageElement.src =
                        "https://via.placeholder.com/600x500?text=Zavora";

                }
            );


            productsGrid.appendChild(
                card
            );

        }
    );

}


/* ==============================
   FILTER BUTTONS
============================== */

function updateButtons(){

    const buttons =
        filterArea.querySelectorAll(
            ".filter-btn"
        );


    buttons.forEach(
        button => {

            button.classList.toggle(
                "active",

                String(
                    button.dataset.category
                )
                .toLowerCase()
                ===
                String(
                    selectedCategory
                )
                .toLowerCase()
            );

        }
    );

}


/* ==============================
   FORMAT NUMBER
============================== */

function formatNumber(value){

    return Number(value)
        .toLocaleString(
            "en-NG",
            {
                maximumFractionDigits:2
            }
        );

}


/* ==============================
   ESCAPE HTML
============================== */

function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

</script></body>
</html>
