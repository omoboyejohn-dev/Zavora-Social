<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zavora Social | Products</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#ffffff;
    color:#111827;
    min-height:100vh;
}

header{
    position:sticky;
    top:0;
    z-index:100;

    border-bottom:1px solid #e5e7eb;
    background:#ffffff;
}

.navbar{
    max-width:1250px;
    min-height:70px;
    margin:auto;
    padding:0 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;
}

.logo{
    color:#111827;
    text-decoration:none;
    font-size:22px;
    font-weight:900;
}

.logo span{
    color:#16a34a;
}

.nav-right{
    display:flex;
    gap:10px;
}

.nav-btn{
    text-decoration:none;

    color:#ffffff;

    background:#16a34a;

    border:1px solid #15803d;

    padding:10px 14px;

    border-radius:10px;

    font-size:13px;
    font-weight:700;

    transition:.2s;
}

.nav-btn:hover{
    background:#15803d;
    transform:translateY(-1px);
}

.container{
    max-width:900px;
    margin:auto;
    padding:28px 15px 60px;
}

.page-title{
    margin-bottom:22px;
}

.page-title h1{
    font-size:30px;
    color:#111827;
    margin-bottom:6px;
}

.page-title p{
    color:#64748b;
    font-size:13px;
}

.filter-area{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.filter-btn{
    border:1px solid #bbf7d0;

    background:#f0fdf4;

    color:#15803d;

    padding:9px 12px;

    border-radius:9px;

    cursor:pointer;

    font-size:12px;
    font-weight:700;

    transition:.2s;
}

.filter-btn:hover{
    background:#dcfce7;
}

.filter-btn.active{
    color:#ffffff;

    border-color:#15803d;

    background:#16a34a;

    box-shadow:0 5px 15px rgba(22,163,74,.15);
}

.products-grid{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.product-card{
    width:100%;
    min-height:76px;

    display:flex;
    align-items:center;

    gap:12px;

    padding:9px 10px;

    background:#ffffff;

    border:1px solid #e5e7eb;

    border-radius:13px;

    transition:.2s;

    box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.product-card:hover{
    border-color:#86efac;
    transform:translateY(-1px);

    box-shadow:0 8px 22px rgba(22,163,74,.10);
}

.product-image{
    width:52px;
    height:52px;
    min-width:52px;

    border-radius:10px;

    overflow:hidden;

    background:#f0fdf4;

    border:1px solid #dcfce7;
}

.product-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

.product-info{
    min-width:0;
    flex:1;

    display:flex;
    flex-direction:column;
    gap:7px;
}

.product-name{
    color:#111827;

    font-size:14px;

    line-height:1.2;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.product-bottom{
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
}

.product-price{
    color:#ffffff;

    background:#16a34a;

    border:1px solid #15803d;

    padding:4px 8px;

    border-radius:6px;

    font-size:11px;

    font-weight:900;

    white-space:nowrap;
}

.stock-status{
    padding:4px 8px;

    border-radius:6px;

    font-size:10px;

    font-weight:800;

    white-space:nowrap;
}

.stock-status.in-stock{
    color:#15803d;

    background:#f0fdf4;

    border:1px solid #bbf7d0;
}

.stock-status.low-stock{
    color:#a16207;

    background:#fefce8;

    border:1px solid #fde68a;
}

.stock-status.out-stock{
    color:#dc2626;

    background:#fef2f2;

    border:1px solid #fecaca;
}

.stock-status.unlimited{
    color:#15803d;

    background:#f0fdf4;

    border:1px solid #bbf7d0;
}

.buy-btn{
    border:none;

    color:#ffffff;

    background:#16a34a;

    padding:9px 13px;

    border-radius:8px;

    cursor:pointer;

    font-size:11px;

    font-weight:900;

    white-space:nowrap;

    transition:.2s;
}

.buy-btn:hover{
    background:#15803d;

    transform:scale(1.03);

    box-shadow:0 5px 15px rgba(22,163,74,.20);
}

.buy-btn.disabled{
    background:#d1d5db;

    color:#6b7280;

    cursor:not-allowed;

    opacity:.75;
}

.loading,
.empty,
.error{
    width:100%;
    text-align:center;
    padding:50px 20px;
    border-radius:15px;
}

.loading{
    color:#64748b;
}

.empty{
    border:1px dashed #d1d5db;
    color:#64748b;
    background:#fafafa;
}

.empty h2,
.error h2{
    color:#111827;
    margin-bottom:8px;
}

.error{
    background:#fef2f2;

    border:1px solid #fecaca;

    color:#dc2626;
}

@media(max-width:600px){

    .navbar{
        padding:0 12px;
    }

    .logo{
        font-size:19px;
    }

    .nav-btn{
        padding:8px 10px;
        font-size:11px;
    }

    .container{
        padding:22px 10px 50px;
    }

    .page-title h1{
        font-size:25px;
    }

    .product-card{
        min-height:70px;
        padding:8px;
        gap:10px;
    }

    .product-image{
        width:48px;
        height:48px;
        min-width:48px;
    }

    .product-name{
        font-size:13px;
    }

    .product-bottom{
        gap:5px;
    }

    .product-price{
        font-size:10px;
        padding:4px 7px;
    }

    .stock-status{
        font-size:9px;
        padding:4px 7px;
    }

    .buy-btn{
        padding:8px 10px;
        font-size:10px;
    }

}

@media(max-width:380px){

    .product-card{
        gap:7px;
    }

    .product-image{
        width:44px;
        height:44px;
        min-width:44px;
    }

    .buy-btn{
        padding:7px 8px;
        font-size:9px;
    }

}

</style>

</head>

<body>

<header>

<div class="navbar">

<a href="dashboard.html" class="logo">
    Zavora <span>Social</span>
</a>

<div class="nav-right">

<a href="dashboard.html" class="nav-btn">
    Dashboard
</a>

<a href="orders.html" class="nav-btn">
    Orders
</a>

</div>

</div>

</header>

<main class="container">

<div class="page-title">

<h1>
    Products
</h1>

<p>
    Browse available products on Zavora Social.
</p>

</div>

<div class="filter-area" id="filterArea">

<button
    class="filter-btn active"
    data-category="all"
>
    All Products
</button>

</div>

<div
    class="products-grid"
    id="productsGrid"
>

<div class="loading">
    Checking your account...
</div>

</div>

</main>

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    onValue
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

apiKey:
    "AIzaSyBzjZ9_rGqPW21duk4sxyLUO3hy3-6GwGs",

authDomain:
    "zavorasocial.firebaseapp.com",

databaseURL:
    "https://zavorasocial-default-rtdb.firebaseio.com/",

projectId:
    "zavorasocial",

storageBucket:
    "zavorasocial.firebasestorage.app",

messagingSenderId:
    "447170165246",

appId:
    "1:447170165246:web:982649e6533257ea0f28af",

measurementId:
    "G-D4LNBEWH50"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getDatabase(app);


const productsGrid =
document.getElementById(
    "productsGrid"
);

const filterArea =
document.getElementById(
    "filterArea"
);


let allProducts = [];

let selectedCategory = "all";

let authResolved = false;


const urlParams =
new URLSearchParams(
    window.location.search
);


const requestedCategory =
urlParams.get("category");


if(requestedCategory){

    selectedCategory =
        decodeURIComponent(
            requestedCategory
        );

}


onAuthStateChanged(

auth,

(user) => {

    authResolved = true;

    if(!user){

        window.location.replace(
            "login.html"
        );

        return;

    }

    loadProducts();

    loadCategories();

}

);


function loadProducts(){

const productsRef =
    ref(
        db,
        "products"
    );


onValue(

    productsRef,

    (snapshot) => {

        const data =
            snapshot.val() || {};


        allProducts =

            Object.entries(data)

            .map(
                ([id,product]) => ({

                    id:id,

                    ...product

                })
            )

            .filter(
                product =>
                    product &&
                    product.active === true
            );


        allProducts.sort(

            (a,b) => {

                const aTime =
                    Number(
                        a.createdAt || 0
                    );

                const bTime =
                    Number(
                        b.createdAt || 0
                    );

                return bTime - aTime;

            }

        );


        renderProducts();

    },

    (error) => {

        console.error(
            "Product loading error:",
            error
        );


        productsGrid.innerHTML = `

            <div class="error">

                <h2>
                    Products unavailable
                </h2>

                <p>
                    We could not load the marketplace products.
                </p>

            </div>

        `;

    }

);

}


function loadCategories(){

const categoriesRef =
    ref(
        db,
        "categories"
    );


onValue(

    categoriesRef,

    (snapshot) => {

        const data =
            snapshot.val() || {};


        Object.entries(data)
        .forEach(

            ([id,category]) => {

                if(
                    !category ||
                    category.active !== true ||
                    !category.name
                ){

                    return;

                }


                const exists =

                    [
                        ...filterArea.children
                    ]
                    .some(

                        button => {

                            return String(
                                button.dataset.category
                            )
                            .toLowerCase()

                            ===

                            String(
                                category.name
                            )
                            .toLowerCase();

                        }

                    );


                if(exists){

                    return;

                }


                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "filter-btn";


                button.dataset.category =
                    category.name;


                button.textContent =

                    (
                        category.icon ||
                        "📦"
                    )

                    + " "

                    + category.name;


                button.addEventListener(

                    "click",

                    () => {

                        selectedCategory =
                            category.name;

                        updateButtons();

                        renderProducts();

                    }

                );


                filterArea.appendChild(
                    button
                );

            }

        );


        updateButtons();

        renderProducts();

    },

    (error) => {

        console.error(
            "Category loading error:",
            error
        );

    }

);

}


function getStockInfo(product){

if(
    product.stock === undefined ||
    product.stock === null ||
    product.stock === ""
){

    return {
        type:"unlimited",
        text:"Unlimited"
    };

}


const stock =
    Number(product.stock);


if(!Number.isFinite(stock)){

    return {
        type:"unlimited",
        text:"Unlimited"
    };

}


if(stock <= 0){

    return {
        type:"out-stock",
        text:"Out of Stock"
    };

}


return {

    type:
        stock <= 5
        ? "low-stock"
        : "in-stock",

    text:
        stock + " Pcs"

};

}


function renderProducts(){

if(!authResolved){

    return;

}


let products =
    allProducts;


if(
    selectedCategory &&
    selectedCategory !== "all"
){

    products =
        allProducts.filter(

            product => {

                return String(
                    product.category || ""
                )
                .toLowerCase()

                ===

                String(
                    selectedCategory
                )
                .toLowerCase();

            }

        );

}


if(products.length === 0){

    productsGrid.innerHTML = `

        <div class="empty">

            <div
                style="
                    font-size:40px;
                    margin-bottom:10px;
                "
            >
                📦
            </div>

            <h2>
                No products available
            </h2>

            <p>

                ${
                    selectedCategory === "all"

                    ? "New products will appear here."

                    : "There are no products in this category yet."

                }

            </p>

        </div>

    `;

    return;

}


productsGrid.innerHTML = "";


products.forEach(

    product => {

        const card =
            document.createElement(
                "article"
            );


        card.className =
            "product-card";


        const image =
            product.image ||

            "https://via.placeholder.com/100x100?text=Zavora";


        const stockInfo =
            getStockInfo(product);


        const isOutOfStock =
            stockInfo.type ===
            "out-stock";


        card.innerHTML = `

            <div class="product-image">

                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(
                        product.name ||
                        "Product"
                    )}"
                >

            </div>

            <div class="product-info">

                <div class="product-name">

                    ${escapeHtml(
                        product.name ||
                        "Unnamed Product"
                    )}

                </div>

                <div class="product-bottom">

                    <div class="product-price">

                        ₦${formatNumber(
                            product.price || 0
                        )}

                    </div>

                    <div
                        class="
                            stock-status
                            ${stockInfo.type}
                        "
                    >

                        ${escapeHtml(
                            stockInfo.text
                        )}

                    </div>

                </div>

            </div>

            <button

                class="
                    buy-btn
                    ${
                        isOutOfStock
                        ? "disabled"
                        : ""
                    }
                "

                ${
                    isOutOfStock
                    ? "disabled"
                    : ""
                }

            >

                ${
                    isOutOfStock
                    ? "SOLD"
                    : "BUY"
                }

            </button>

        `;


        const buyButton =
            card.querySelector(
                ".buy-btn"
            );


        if(!isOutOfStock){

            buyButton.addEventListener(

                "click",

                () => {

                    window.location.href =
                        "product.html?id=" +
                        encodeURIComponent(
                            product.id
                        );

                }

            );

        }


        const imageElement =
            card.querySelector("img");


        imageElement.addEventListener(

            "error",

            () => {

                imageElement.src =
                    "https://via.placeholder.com/100x100?text=Zavora";

            }

        );


        productsGrid.appendChild(
            card
        );

    }

);


}


function updateButtons(){

const buttons =
    filterArea.querySelectorAll(
        ".filter-btn"
    );


buttons.forEach(

    button => {

        button.classList.toggle(

            "active",

            String(
                button.dataset.category
            )
            .toLowerCase()

            ===

            String(
                selectedCategory
            )
            .toLowerCase()

        );

    }

);

}


function formatNumber(value){

return Number(value)

    .toLocaleString(

        "en-NG",

        {
            maximumFractionDigits:2
        }

    );

}


function escapeHtml(value){

return String(value)

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}

</script>

</body>
</html>
